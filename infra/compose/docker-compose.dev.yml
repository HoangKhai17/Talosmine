# Overlay CHỈ DÙNG CHO DEV TRÊN MÁY CÁ NHÂN.
#
# Vấn đề nó giải: docker-compose.yml (production baseline) cố ý KHÔNG publish port nào
# (DEC-T10). Điều đó đúng cho production, nhưng khiến drizzle-kit, Drizzle Studio và
# `psql` chạy trên host không tới được database.
#
# Cách dùng — phải nêu CẢ HAI file, overlay đứng sau:
#   docker compose -f infra/compose/docker-compose.yml \
#                  -f infra/compose/docker-compose.dev.yml \
#                  --env-file .env up -d
#
# An toàn:
#   - Bind vào 127.0.0.1, KHÔNG phải 0.0.0.0. Chỉ máy này truy cập được; không lộ ra LAN.
#   - File này KHÔNG BAO GIỜ được dùng ở staging/production. Lệnh production chỉ nêu
#     docker-compose.yml. P8 coi việc một service ngoài Caddy publish port ra Internet
#     là stop condition.
#   - Overlay chỉ THÊM `ports`. Nó không đổi image, network, volume hay biến môi trường,
#     nên baseline vẫn là nguồn sự thật duy nhất về cấu hình.

# Cổng host cố ý KHÔNG dùng 5432/6543 mặc định.
# Máy dev này đã có một PostgreSQL khác chạy trên 5432 (dự án khác của chủ dự án).
# Chiếm cổng đó sẽ hoặc fail lúc `up`, hoặc tệ hơn: làm công cụ trỏ nhầm database.
# Dịch sang dải 55xxx để hai dự án sống chung hoà bình trên cùng một máy.

services:
  db:
    ports:
      # 55432 -> đường TRỰC TIẾP tới PostgreSQL, không qua pooler.
      # Dùng cho: `pnpm db:migrate` (role migration cần session ổn định để chạy DDL).
      - '127.0.0.1:55432:5432'

  supavisor:
    ports:
      # 56543 -> transaction pooler. Đây là đường RUNTIME mà API/worker dùng.
      # Dùng cho: chạy API ở host và mọi test cần đi đúng đường như production.
      - '127.0.0.1:56543:6543'
