# Talosmine — Supabase self-hosted RÚT GỌN (DEC-T10).
#
# Nguồn: docker/docker-compose.yml của supabase/supabase tại tag v1.26.07.
# Bản gốc có 11 service; bản này giữ 2. Xem infra/compose/IMAGE-PINS.md để biết digest.
#
# GIỮ:  db (PostgreSQL), supavisor (transaction pooler), volume db-config
# BỎ:   auth (GoTrue), rest (PostgREST), realtime, storage, imgproxy, functions,
#       studio, meta, kong, volume deno-cache
#
# Vì sao bỏ — hai lý do khác nhau, đừng lẫn:
#   - GoTrue: dự án dùng Auth0 cho identity. GoTrue là identity provider thứ hai
#     không ai dùng nhưng vẫn chạy → bề mặt tấn công thừa.
#   - PostgREST: đây là lý do BẢO MẬT, không phải dọn dẹp. Nó phơi toàn bộ database
#     ra thành REST API, tức một đường vào `db` VÒNG QUA toàn bộ enforcement
#     entitlement/quota của Control Plane. Nó là stop condition kể cả khi không
#     lộ ra Internet (docs/build-plan/phase-8 mục 19).
#   - studio/meta/kong: nhánh (a)/(b) của DEC-T10 chưa chốt. Bản này theo nhánh (b)
#     — quản trị DB bằng `pnpm db:studio` (Drizzle Studio). Nếu đổi sang (a) thì
#     phải ghi record superseding, không sửa file này rồi thôi.
#
# MẠNG: KHÔNG service nào publish port ra host. Bản gốc có `ports:` ở supavisor —
# đã bỏ có chủ đích. Chỉ Caddy được expose (DEC-T11). Truy cập DB lúc dev đi qua
# `docker compose exec` hoặc container phụ trong cùng network.

name: talosmine

services:
  db:
    container_name: talosmine-db
    # Pin cả tag (để người đọc biết version) lẫn digest (để bất biến — DEC-T10).
    # Digest thắng khi Docker resolve; tag chỉ là nhãn. Xem infra/compose/IMAGE-PINS.md.
    image: supabase/postgres:17.6.1.136@sha256:f371b5f3f2ac0a05703f33d6e6134515fb2498cab708fb948a0aeb7481467c00
    restart: unless-stopped
    # KHÔNG có `ports:` — DB không bao giờ bind ra host.
    volumes:
      # Init script của Supabase, đã lọc còn đúng thứ supavisor cần.
      # Bỏ realtime.sql / webhooks.sql / logs.sql / jwt.sql vì các service dùng chúng
      # đã bị loại khỏi compose này.
      - ./volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      - ./volumes/db/_supabase.sql:/docker-entrypoint-initdb.d/migrations/97-_supabase.sql:Z
      - ./volumes/db/pooler.sql:/docker-entrypoint-initdb.d/migrations/99-pooler.sql:Z
      # Role riêng của Talosmine. Phải là .sql (migrate.sh của image lờ file .sh)
      # và phải nằm ở migrations/ để chạy bằng supabase_admin — user `postgres`
      # đã bị demote ở post-setup nên không tạo được role.
      - ./volumes/db/talosmine-roles.sql:/docker-entrypoint-initdb.d/migrations/99-talosmine-roles.sql:Z
      # Database riêng cho Logto (DEC-T22). Chạy sau role Talosmine.
      - ./volumes/db/logto-database.sql:/docker-entrypoint-initdb.d/migrations/99b-logto-database.sql:Z
      # Named volume: KHÔNG dùng hậu tố `:Z` (đó là tuỳ chọn SELinux của bind mount).
      - db-data:/var/lib/postgresql/data
      # BẮT BUỘC: giữ pgsodium decryption key qua các lần restart.
      # Bỏ volume này = mất key = dữ liệu mã hoá bằng pgsodium không đọc lại được.
      # Backup phải bao gồm nó (docs/build-plan/phase-8 mục 8).
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'supabase_admin', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 10
      # start_period: init script của Supabase chạy khá lâu. Không có nó, các lần
      # kiểm tra fail trong giai đoạn init bị tính là hỏng, `db` bị coi là unhealthy
      # và `supavisor` (depends_on: service_healthy) bỏ cuộc dù db rồi sẽ khoẻ.
      start_period: 90s
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD là bắt buộc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD là bắt buộc}
      PGDATABASE: ${POSTGRES_DB:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      # KHÔNG set POSTGRES_USER ở đây.
      # Image supabase/postgres mặc định POSTGRES_USER=supabase_admin, và toàn bộ
      # `migrate.sh` của image kết nối bằng chính role đó ngay câu lệnh đầu tiên.
      # Đặt POSTGRES_USER=postgres sẽ khiến initdb tạo superuser tên `postgres`,
      # `supabase_admin` không bao giờ tồn tại, migrate.sh chết ở dòng 1 và KHÔNG
      # init script nào được áp dụng — thất bại im lặng, container vẫn báo healthy.
      # Compose chính thức cũng cố ý không set biến này.
      LOGTO_DB_PASSWORD: ${LOGTO_DB_PASSWORD:?bắt buộc}
      TALOSMINE_MIGRATION_PASSWORD: ${TALOSMINE_MIGRATION_PASSWORD:?bắt buộc}
      TALOSMINE_RUNTIME_PASSWORD: ${TALOSMINE_RUNTIME_PASSWORD:?bắt buộc}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    networks: [talosmine-internal]

  supavisor:
    container_name: talosmine-pooler
    image: supabase/supavisor:2.9.5@sha256:31c2f05b13b11069660fdfae2f6cfd37b509748d2710aca121cfee8b16cb8b07
    restart: unless-stopped
    # Bản gốc publish 5432 và 6543 ra host. ĐÃ BỎ có chủ đích (DEC-T10):
    # không service Supabase nào được bind ra host. App nói chuyện với pooler
    # qua network nội bộ bằng hostname `supavisor`.
    volumes:
      - ./volumes/pooler/pooler.exs:/etc/pooler/pooler.exs:ro,z
    healthcheck:
      test: ['CMD', 'curl', '-sSfL', '--head', '-o', '/dev/null', 'http://127.0.0.1:4000/api/health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      POSTGRES_PORT: 5432
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?bắt buộc}
      DATABASE_URL: ecto://supabase_admin:${POSTGRES_PASSWORD}@db:5432/_supabase
      CLUSTER_POSTGRES: 'true'
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?bắt buộc}
      VAULT_ENC_KEY: ${VAULT_ENC_KEY:?bắt buộc}
      API_JWT_SECRET: ${JWT_SECRET:?bắt buộc}
      METRICS_JWT_SECRET: ${JWT_SECRET:?bắt buộc}
      REGION: local
      ERL_AFLAGS: -proto_dist inet_tcp
      POOLER_TENANT_ID: ${POOLER_TENANT_ID:-talosmine}
      POOLER_DEFAULT_POOL_SIZE: ${POOLER_DEFAULT_POOL_SIZE:-20}
      POOLER_MAX_CLIENT_CONN: ${POOLER_MAX_CLIENT_CONN:-100}
      # transaction mode là ràng buộc kiến trúc, không phải tuning.
      # Nó là lý do driver PHẢI đặt `prepare: false` (DEC-T09) và là lý do
      # spike P1.5 phải chứng minh transaction pinning trước khi P5 được build.
      POOLER_POOL_MODE: transaction
      DB_POOL_SIZE: ${POOLER_DB_POOL_SIZE:-5}
    command:
      - /bin/sh
      - -c
      - /app/bin/migrate && /app/bin/supavisor eval "$$(cat /etc/pooler/pooler.exs)" && /app/bin/server
    networks: [talosmine-internal]

  # ── Logto — identity provider self-host (DEC-T22) ──────────────────────────
  # Thay cho Auth0 managed: credential và dữ liệu xác thực nằm trên hạ tầng do dự án
  # kiểm soát. Vẫn là OIDC chuẩn nên Control Plane không cần biết đây là Logto.
  logto:
    container_name: talosmine-logto
    image: svhd/logto:1.41.0@sha256:7f79547e3d1fe569a3ecae757968a7cfc579687aa8164eec35113c0adc983c5b
    restart: unless-stopped
    # KHÔNG có `ports:` — giống mọi service khác, chỉ Caddy expose (DEC-T10/T11).
    # Dev overlay mở port để làm việc ở local.
    depends_on:
      db:
        condition: service_healthy
    # Lần chạy đầu cần seed schema của Logto. `db seed` idempotent: đã seed rồi thì bỏ qua,
    # nên để nguyên trong entrypoint cũng không hỏng ở các lần khởi động sau.
    entrypoint: ['sh', '-c', 'npm run cli db seed -- --swe && npm start']
    volumes:
      # ── Giao diện đăng nhập của Talosmine ───────────────────────────────────
      #
      # Mount ĐÈ lên thư mục giao diện mặc định của Logto. Từ đây, trang mà người dùng thấy
      # ở `/sign-in` và `/register` là ba file tĩnh trong `apps/logto-ui/`.
      #
      # VÌ SAO MOUNT CHỨ KHÔNG DÙNG TÍNH NĂNG "CUSTOM UI ASSETS" CỦA LOGTO:
      #
      #   1. Tính năng đó nhận một file ZIP rồi đẩy lên object storage. Instance này chưa
      #      cấu hình storage provider nào (bảng `systems` chỉ có `alterationState`), nên
      #      lệnh upload sẽ trả 500. Dùng được thì phải dựng thêm một dịch vụ lưu trữ.
      #   2. Kể cả có storage, giao diện khi đó nằm trong database dưới dạng một zip mờ
      #      đục — không diff được, không review được, không có trong git. Cùng lý do ta
      #      không tạo bảng bằng tay mà viết migration.
      #
      # `:ro` — container không có việc gì phải ghi vào đây.
      #
      # `config.js` trong gói này mang giá trị AN TOÀN CHO PRODUCTION (địa chỉ web app để
      # trống ⇒ link "Về trang chủ" tự ẩn). Dev overlay mount đè `config.dev.js` lên nó.
      #
      # Mặc định nghiêng về an toàn có chủ đích: quên cấu hình thì mất một link, chứ không
      # phải có một link trỏ về `localhost` trên trang đăng nhập production.
      #
      # ⚠ MOUNT NÀY THAY TOÀN BỘ giao diện của Logto, không chỉ hai màn hình. Bật thêm bất
      # kỳ luồng nào ở Logto (quên mật khẩu, MFA, đăng nhập mạng xã hội) thì phải dựng thêm
      # màn hình tương ứng trong `apps/logto-ui/`, nếu không luồng đó rơi vào màn hình dự
      # phòng. Xem `apps/logto-ui/README.md`.
      - ../../apps/logto-ui:/etc/logto/packages/experience/dist:ro
    environment:
      NODE_ENV: production
      DB_URL: postgres://logto:${LOGTO_DB_PASSWORD:?bắt buộc}@db:5432/logto
      # URL mà BROWSER dùng để tới Logto. Ở dev là localhost qua dev overlay; lên
      # production đổi sang domain thật đứng sau Caddy.
      ENDPOINT: ${LOGTO_ENDPOINT:-http://localhost:3001}
      ADMIN_ENDPOINT: ${LOGTO_ADMIN_ENDPOINT:-http://localhost:3002}
      TRUST_PROXY_HEADER: 1
      # Tắt telemetry gửi ra ngoài. Image mặc định trỏ tới một endpoint khảo sát của
      # Logto — không phù hợp với lý do ta tự host (giữ dữ liệu trong tầm kiểm soát).
      LOGTO_OSS_SURVEY_ENDPOINT: ''
    networks: [talosmine-internal]

volumes:
  db-data:
  # Xem ghi chú ở service `db`: volume này giữ pgsodium key. Không xoá.
  db-config:

networks:
  talosmine-internal:
    driver: bridge
