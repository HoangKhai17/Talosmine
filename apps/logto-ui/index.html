<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Talosmine — Đăng nhập</title>

    <!--
      KHÔNG có favicon, không có font từ CDN, không có script bên ngoài.

      Trang này là trang người dùng gõ mật khẩu. Mỗi tài nguyên tải từ máy chủ bên thứ ba
      là một lượt rò IP và Referer của họ ra ngoài, ngay tại nơi nhạy cảm nhất — và cũng là
      một nơi để chèn mã nếu bên đó bị chiếm.
    -->
    <!--
      ⚠⚠ `?v=` — PHẢI TĂNG SỐ NÀY MỖI KHI SỬA app.js, globals.css HOẶC auth.css. ⚠⚠

      Logto phục vụ file tĩnh với `Cache-Control: max-age=604800` — BẢY NGÀY — và ta không
      đổi được header đó (nó là static server của Logto, không phải của mình).

      Riêng chính file HTML này thì `no-cache`, nên nó luôn tải mới. Vì vậy đổi số `v` ở đây
      là cách DUY NHẤT buộc trình duyệt lấy bản mới của JS/CSS.

      Quên tăng số = sửa xong nhưng không ai thấy gì thay đổi, kể cả sau khi tải lại trang.
      Đã mắc đúng lỗi này ngày 2026-07-22: nhiều vòng sửa liên tiếp không hiện ra vì trình
      duyệt vẫn dùng bản cũ trong cache.

      Hai file, đúng cách phân chia của `apps/web`:
        globals.css  token, reset, thang chữ, class tiện ích  (bản port của web app)
        auth.css     bố cục riêng của trang này               (không có font-size nào)

      Thứ tự bắt buộc: `auth.css` dùng token do `globals.css` khai.

      Font nạp trước bằng `preload` vì nó nằm trên đường tới nội dung đầu tiên người dùng
      nhìn thấy; không có nó, chữ hiện bằng font hệ thống rồi nhảy khi Montserrat về.
      `crossorigin` là BẮT BUỘC với font kể cả cùng origin — thiếu nó trình duyệt tải hai
      lần vì hai request khác chế độ CORS.

      Font KHÔNG cần `?v=`: tên file đã gắn với nội dung, đổi font là đổi tên file.
    -->
    <link
      rel="preload"
      href="/fonts/montserrat-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/globals.css?v=18" />
    <link rel="stylesheet" href="/auth.css?v=18" />
  </head>

  <body>
    <!--
      MỘT tài liệu HTML phục vụ mọi đường dẫn của Logto (/sign-in, /register, …). Đây là
      SPA: `app.js` đọc `location.pathname` rồi hiện đúng màn hình.

      Toàn bộ nội dung dựng bằng JavaScript thay vì viết sẵn ở đây, để chỉ có MỘT nguồn sự
      thật cho mỗi màn hình. Viết sẵn HTML rồi lại dựng bằng JS là cách chắc chắn để hai bản
      lệch nhau.
    -->
    <!--
      `#root` là VỎ TRỐNG, KHÔNG mang class bố cục nào.

      Trước đây nó mang `class="page"`, trong khi `app.js` cũng dựng một `div.page` bên
      trong — thành hai lưới hai cột lồng nhau. Lưới ngoài đặt trọn màn hình vào cột thứ
      nhất của nó, nên toàn bộ trang co lại còn khoảng 40% bề ngang và nửa phải bỏ trống.
      Lỗi chỉ lộ ra ở màn rộng: dưới 1024px cả hai lưới đều một cột nên trông vẫn bình
      thường.

      Bố cục thuộc về màn hình do `app.js` dựng. Vỏ này không được biết gì về nó.
    -->
    <div id="root">
      <noscript>
        <div class="noscript">
          <p>Trang đăng nhập cần JavaScript để hoạt động.</p>
        </div>
      </noscript>
    </div>

    <!-- `config.js` phải nạp TRƯỚC `app.js`: app đọc `window.TALOSMINE_APP_URL` lúc render.
         `?v=` — xem ghi chú ở <head>. Tăng số khi sửa file. -->
    <script src="/config.js?v=18"></script>
    <script src="/app.js?v=18"></script>
  </body>
</html>
