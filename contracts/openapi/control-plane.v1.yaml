          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags: [admin]
      operationId: adminAssignRole
      summary: Cap vai tro cho mot tai khoan
      description: |
        CHOT CHAN LEO THANG DAC QUYEN: nguoi goi phai TU CO moi permission cua vai tro duoc
        cap. Thieu rang buoc nay thi mot admin quyen thap co the tu nang minh len toan quyen
        qua hai buoc, va moi gioi han quyen khac deu vo nghia.

        Ghi assignment va audit trong CUNG mot transaction.
      security:
        - webSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId, accountId, reason]
              properties:
                roleId: { type: string, format: uuid }
                accountId: { type: string, format: uuid }
                reason:
                  type: string
                  minLength: 1
                validUntil:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Da cap.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        '400':
          description: Thieu `reason`, ID sai dinh dang, hoac vai tro dang bi vo hieu hoa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: |
            Thieu permission `admin_role:manage`, HOAC dang co cap quyen ma chinh minh
            khong co.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Khong tim thay vai tro hoac tai khoan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Tai khoan da co vai tro nay va con hieu luc.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/admin/rbac/assignments/{assignmentId}:
    delete:
      tags: [admin]
      operationId: adminRevokeAssignment
      summary: Thu hoi mot phan quyen
      description: |
        Thu hoi = ghi ba cot `revoked_*`, KHONG xoa dong.

        Request mang BODY du la `DELETE`: `reason` bat buoc cho nhat ky kiem toan, va HTTP
        khong cam `DELETE` co body.
      security:
        - webSession: []
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        '204':
          description: Da thu hoi.
        '400':
          description: Thieu `reason`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Thieu permission `admin_role:manage`, hoac thieu/sai CSRF token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Khong tim thay phan quyen dang hieu luc.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/admin/accounts:
    get:
      tags: [admin]
      operationId: adminSearchAccounts
      summary: Tìm account (quản trị)
      description: |
        Yêu cầu permission `account:read`.

        CHỐNG DÒ DỮ LIỆU: `query` rỗng trả về danh sách RỖNG, không trả toàn bộ account.
        Đây là công cụ tra một người cụ thể, không phải để tải danh bạ người dùng.

        Phân trang theo cursor (`createdAt` giảm dần), không dùng offset: offset lớn càng
        sâu càng chậm, và bản ghi chèn vào giữa lúc lật trang sẽ gây nhảy hoặc lặp.
      security:
        - webSession: []
      parameters:
        - name: query
          in: query
          required: false
          schema: { type: string }
          description: Email, tên hiển thị (khớp một phần) hoặc UUID account (khớp chính xác).
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Giá trị `nextCursor` của trang trước.
      responses:
        '200':
          description: Kết quả tìm kiếm.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminAccount'
                  nextCursor:
                    type: [string, 'null']
                    format: date-time
        '401':
          description: Thiếu phiên hoặc phiên không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Thiếu permission `account:read`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/admin/accounts/{accountId}/sessions:
    get:
      tags: [admin]
      operationId: adminListAccountSessions
      summary: Liệt kê phiên của một account (quản trị)
      description: |
        Yêu cầu permission `session:revoke` — KHÔNG phải `account:read`. Nhìn thấy thiết bị
        và thời điểm hoạt động của người khác là dữ liệu nhạy cảm, và người xem danh sách
        này chính là người sẽ quyết định thu hồi.

        KHÔNG trả token hay hash dưới bất kỳ dạng nào.
      security:
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Metadata phiên.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, createdAt, lastSeenAt, expiresAt, revokedAt]
                  properties:
                    id: { type: string, format: uuid }
                    createdAt: { type: string, format: date-time }
                    lastSeenAt: { type: string, format: date-time }
                    expiresAt: { type: string, format: date-time }
                    revokedAt: { type: [string, 'null'], format: date-time }
        '401':
          description: Thiếu phiên hoặc phiên không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Thiếu permission `session:revoke`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/admin/accounts/{accountId}:
    get:
      tags: [admin]
      operationId: adminGetAccount
      summary: Xem account bất kỳ (quản trị)
      description: |
        Yêu cầu permission `account:read`. Trả nhiều trường hơn view của user (có `disabledAt`).
      security:
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/accounts/{accountId}/disable:
    post:
      tags: [admin]
      operationId: adminDisableAccount
      summary: Vô hiệu hóa account
      description: |
        Yêu cầu permission `account:disable`. Trong MỘT transaction: đổi status sang
        `disabled`, **thu hồi mọi phiên** của user đó, và ghi audit. Thất bại ở bất kỳ
        bước nào rollback cả ba.
      security:
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReason'
      responses:
        '204':
          description: Đã vô hiệu hóa.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/accounts/{accountId}/enable:
    post:
      tags: [admin]
      operationId: adminEnableAccount
      summary: Kích hoạt lại account đã bị vô hiệu hóa
      description: |
        Yêu cầu permission `account:enable` — TÁCH RIÊNG khỏi `account:disable` vì
        `disabled -> active` là hành động nhạy cảm hơn. Reason bắt buộc, audit đồng bộ.
      security:
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReason'
      responses:
        '204':
          description: Đã kích hoạt lại.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/accounts/{accountId}/revoke-sessions:
    post:
      tags: [admin]
      operationId: adminRevokeAccountSessions
      summary: Thu hồi toàn bộ phiên của một account
      description: |
        Yêu cầu permission `session:revoke`. Dùng khi nghi ngờ tài khoản bị chiếm.
        Idempotent — không còn phiên nào vẫn trả 204.
      security:
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReason'
      responses:
        '204':
          description: Đã thu hồi.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ── Site content: điều hướng header/footer (DEC-T25, DEC-T26) ──────────────────

  /v1/site/nav:
    get:
      tags: [site-content]
      operationId: getSiteNav
      summary: Điều hướng header và footer cho một ngôn ngữ
      description: |
        CÔNG KHAI — không cần phiên đăng nhập. Header và footer hiện trên mọi trang, kể cả
        với khách chưa đăng nhập; bắt buộc phiên ở đây sẽ làm trang chủ không render nổi.

        CHỈ trả mục `active`. Mục `draft` (đang soạn) và `inactive` (đã gỡ) không xuất hiện.

        Nhãn trả về theo `locale` yêu cầu. Mục thiếu bản dịch cho ngôn ngữ đó bị BỎ QUA —
        thà thiếu một mục menu còn hơn hiện nhãn sai ngôn ngữ giữa một trang.

        BFF cache kết quả này 60 giây (DEC-T26), nên thay đổi từ `/admin` hiện ra trong
        vòng một phút chứ không tức thì.
      parameters:
        - name: locale
          in: query
          required: true
          description: Ngôn ngữ cần lấy nhãn. Danh mục đóng theo DEC-B15.
          schema:
            type: string
            enum: [vi, en]
      responses:
        '200':
          description: Các menu, mỗi menu kèm danh sách mục đã sắp theo `sortOrder`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteNav'
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/admin/site/nav:
    get:
      tags: [admin]
      operationId: adminListNavItems
      summary: Toàn bộ mục điều hướng (quản trị)
      description: |
        Yêu cầu `content:read`. Trả MỌI trạng thái (kể cả `draft`, `inactive`) và MỌI ngôn
        ngữ — màn hình quản trị cần thấy cả những gì người dùng chưa thấy.
      security:
        - webSession: []
      responses:
        '200':
          description: Danh sách mục, sắp theo `menuKey` rồi `sortOrder`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminNavItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [admin]
      operationId: adminCreateNavItem
      summary: Thêm một mục điều hướng
      description: |
        Yêu cầu `content:manage`. Mục mới LUÔN ở trạng thái `draft` — không tạo thẳng
        `active`. Đưa lên header/footer là hành động riêng cần `content:publish`.

        `sortOrder` bỏ trống thì mục được xếp cuối menu.

        `href` phải là đường dẫn nội bộ bắt đầu bằng `/` (KHÔNG phải `//`) hoặc URL `https://`
        đã nằm trong allowlist. Xem `docs/url-policy.md`.
      security:
        - webSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNavItemRequest'
      responses:
        '201':
          description: Đã tạo.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                additionalProperties: false
                properties:
                  id: { type: string, format: uuid }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/site/nav/{navItemId}:
    patch:
      tags: [admin]
      operationId: adminUpdateNavItem
      summary: Sửa href và nhãn của một mục
      description: |
        Yêu cầu `content:manage`. KHÔNG sửa được `status` ở đây — nó có đường riêng vì cần
        permission khác. `menuKey` cũng không sửa được: chuyển mục sang menu khác là xoá và
        tạo lại, và như vậy dấu vết audit nói đúng chuyện gì đã xảy ra.
      security:
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/NavItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNavItemRequest'
      responses:
        '204':
          description: Đã lưu.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [admin]
      operationId: adminDeleteNavItem
      summary: Xoá một mục điều hướng
      description: |
        Yêu cầu `content:manage`.

        VÌ SAO Ở ĐÂY CÓ XOÁ THẬT trong khi catalog thì không: một mục menu không được tham
        chiếu bởi entitlement, quota hay dữ liệu usage nào. Xoá nó không để lại bản ghi mồ
        côi. Bản dịch đi theo bằng `ON DELETE CASCADE`.

        Vẫn ghi audit kèm lý do — nội dung đã từng hiển thị công khai.
      security:
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/NavItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReason'
      responses:
        '204':
          description: Đã xoá.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/site/nav/{navItemId}/status:
    post:
      tags: [admin]
      operationId: adminChangeNavItemStatus
      summary: Đưa mục lên hoặc gỡ khỏi giao diện
      description: |
        Yêu cầu `content:publish` — permission RIÊNG, không phải `content:manage`.

        Lý do tách: đổi sang `active` là đưa mục đó lên header/footer của MỌI trang, cho MỌI
        khách. Người sửa nhãn và người quyết định phát hành không nhất thiết là một.

        Chỉ nhận `active` và `inactive`. `draft` không phải đích hợp lệ của bất kỳ chuyển
        tiếp nào — mục đã từng hiển thị không quay lại được trạng thái "chưa từng phát hành".
      security:
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/NavItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeContentStatusRequest'
      responses:
        '204':
          description: Đã đổi trạng thái.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/site/nav/reorder:
    post:
      tags: [admin]
      operationId: adminReorderNavItems
      summary: Sắp xếp lại thứ tự các mục trong một menu
      description: |
        Yêu cầu `content:manage`.

        Nhận TOÀN BỘ danh sách id của menu theo thứ tự mới, không nhận thao tác "đổi chỗ hai
        mục". Gửi trọn danh sách khiến kết quả không phụ thuộc thứ tự request tới, nên hai
        người biên tập sắp xếp cùng lúc không tạo ra thứ tự lai giữa hai ý định.

        Thiếu id nào của menu đó, hoặc thừa id không thuộc menu đó, đều bị từ chối.
      security:
        - webSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderNavRequest'
      responses:
        '204':
          description: Đã sắp xếp lại.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/site/settings:
    get:
      tags: [site-content]
      operationId: getSiteSettings
      summary: Cài đặt chung của site (logo)
      description: |
        CÔNG KHAI — không cần phiên, cùng lý do với `/v1/site/nav`: logo nằm trên header của
        mọi trang, kể cả với khách chưa đăng nhập.

        KHÔNG phụ thuộc ngôn ngữ, nên không có tham số `locale`.

        BFF cache 60 giây (DEC-T26).
      responses:
        '200':
          description: Cài đặt hiện tại. Giá trị `null` nghĩa là chưa đặt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteSettings'

  /v1/admin/site/settings:
    get:
      tags: [admin]
      operationId: adminGetSiteSettings
      summary: Cài đặt site (quản trị)
      description: Yêu cầu `content:read`. Cùng hình dạng với đường công khai.
      security:
        - webSession: []
      responses:
        '200':
          description: Cài đặt hiện tại.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [admin]
      operationId: adminUpdateSiteSettings
      summary: Đổi cài đặt site
      description: |
        Yêu cầu `content:manage`.

        `logoUrl` phải là URL `https://` có host nằm trong allowlist, hoặc đường dẫn nội bộ
        bắt đầu bằng `/`. Cùng bộ kiểm với `href` của mục điều hướng — xem `docs/url-policy.md`.

        `logoUrl: null` XOÁ logo; header quay về hiển thị tên thương hiệu bằng chữ.

        KHÔNG có upload file ở đây: object storage chưa được dựng (DEC-T12). Quản trị viên
        dán URL của ảnh đã host sẵn. Khi có storage, nút upload sẽ ghi vào đúng trường này.
      security:
        - webSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSiteSettingsRequest'
      responses:
        '204':
          description: Đã lưu.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/site/logo:
    get:
      tags: [site-content]
      operationId: getSiteLogo
      summary: File logo đã tải lên
      description: |
        CÔNG KHAI — trả BYTES của logo do quản trị viên tải lên (bảng `site_assets`,
        migration 0015) kèm đúng `Content-Type`. 404 khi chưa tải logo nào — người gọi rơi
        về `site_settings.logo.url` rồi về logo chữ; thứ tự đó do BFF xử lý ở
        `/api/brand/logo`.
      responses:
        '200':
          description: Bytes của ảnh logo (png/jpeg/webp).
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Chưa tải logo nào lên.

  /v1/admin/site/logo:
    put:
      tags: [admin]
      operationId: adminUploadSiteLogo
      summary: Tải logo lên
      description: |
        Yêu cầu `content:manage`. Ảnh gửi dạng base64 trong JSON — trần 512KB SAU giải mã
        (CHECK ở database là chốt chặn cuối).

        Danh mục MIME ĐÓNG: png/jpeg/webp. KHÔNG nhận SVG — SVG là XML chạy được, phục vụ
        nó từ origin của chính mình là một đường XSS.
      security:
        - webSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadSiteLogoRequest'
      responses:
        '204':
          description: Đã lưu.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [admin]
      operationId: adminDeleteSiteLogo
      summary: Gỡ logo đã tải lên
      description: |
        Yêu cầu `content:manage`. Sau khi gỡ, web rơi về `site_settings.logo.url` (nếu đặt)
        rồi về logo chữ.
      security:
        - webSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReason'
      responses:
        '204':
          description: Đã gỡ (kể cả khi vốn không có gì để gỡ — kết quả cuối như nhau).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/site/content:
    get:
      tags: [site-content]
      operationId: getSiteContent
      summary: Khe nội dung của các trang, theo một ngôn ngữ
      description: |
        CÔNG KHAI — không cần phiên, cùng lý do với `/v1/site/nav`: chữ này nằm trên các
        trang marketing mở cho mọi khách.

        Chỉ trả những khoá ĐÃ ĐƯỢC ĐẶT. Khoá vắng mặt nghĩa là "dùng chữ mặc định trong
        code" — web merge kết quả này đè lên message catalog, nên bảng rỗng cho ra trang
        y nguyên bản hardcode. Đó là đường lui, không phải lỗi.

        BFF cache 60 giây (DEC-T26).
      parameters:
        - name: locale
          in: query
          required: true
          schema:
            type: string
            enum: [vi, en]
      responses:
        '200':
          description: Các khe đã đặt cho ngôn ngữ này.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteContent'
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/admin/site/content:
    get:
      tags: [admin]
      operationId: adminListSiteContent
      summary: Khe nội dung (quản trị)
      description: |
        Yêu cầu `content:read`. Trả CẢ HAI ngôn ngữ cạnh nhau — màn hình quản trị sửa song
        song vi/en.

        Cũng chỉ trả khoá đã đặt: DANH MỤC khoá (nhóm, nhãn hiển thị, chữ mặc định) nằm
        trong code của web — nơi duy nhất biết khe nào render ở đâu — không phải ở đây.
      security:
        - webSession: []
      responses:
        '200':
          description: Toàn bộ khe đã đặt.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminContentSlot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/site/content/{slotKey}:
    patch:
      tags: [admin]
      operationId: adminUpdateSiteContent
      summary: Đặt hoặc xoá giá trị một khe nội dung
      description: |
        Yêu cầu `content:manage`.

        Ngữ nghĩa từng ngôn ngữ trong `values`: vắng mặt = không đổi; chuỗi có chữ = đặt;
        `null` hoặc chuỗi rỗng = XOÁ — trang quay về chữ mặc định trong code. Xoá là thao
        tác biên tập bình thường, không phải huỷ dữ liệu.

        KHÔNG nhận HTML — giá trị là chữ thuần, render qua JSX nên markup không bao giờ
        chạy, và CSP theo nonce (DEC-T20) là ranh giới không thương lượng.
      security:
        - webSession: []
      parameters:
        - name: slotKey
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ContentSlotKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContentSlotRequest'
      responses:
        '204':
          description: Đã lưu.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ── Survey: quản trị ───────────────────────────────────────────────────────

  /v1/admin/survey/questions:
    get:
      tags: [admin]
      operationId: adminListSurveyQuestions
      summary: Câu hỏi khảo sát (quản trị)
      description: |
        Yêu cầu `content:read`. Trả MỌI trạng thái và MỌI ngôn ngữ — màn hình quản trị cần
        thấy cả những gì người dùng chưa thấy, và sửa được cả hai bản dịch cạnh nhau.

        KHÔNG có endpoint tạo/xoá câu hỏi: cấu trúc ba câu là cố định, seed bằng migration
        vì code phải có chỗ render tương ứng. Chỉ nội dung và danh sách lựa chọn là mở.
      security:
        - webSession: []
      responses:
        '200':
          description: Danh sách câu hỏi, sắp theo `sortOrder`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminSurveyQuestion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/survey/questions/{questionId}:
    patch:
      tags: [admin]
      operationId: adminUpdateSurveyQuestion
      summary: Sửa nội dung một câu hỏi
      description: |
        Yêu cầu `content:manage`. Sửa được `minSelect` và bản dịch.

        KHÔNG sửa được `key` (code tham chiếu nó để render đúng layout) và `kind` (đổi
        `multi` thành `single` sẽ làm dữ liệu đã thu thập mâu thuẫn với ràng buộc mới).
      security:
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/SurveyQuestionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSurveyQuestionRequest'
      responses:
        '204':
          description: Đã lưu.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/survey/options:
    post:
      tags: [admin]
      operationId: adminCreateSurveyOption
      summary: Thêm một lựa chọn
      description: |
        Yêu cầu `content:manage`. Lựa chọn mới LUÔN ở `draft` — đưa ra trước người dùng là
        hành động riêng cần `content:publish`.

        `sortOrder` bỏ trống thì xếp cuối. `icon` phải thuộc danh mục đóng.
      security:
        - webSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSurveyOptionRequest'
      responses:
        '201':
          description: Đã tạo.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                additionalProperties: false
                properties:
                  id: { type: string, format: uuid }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: '`key` đã tồn tại trong câu hỏi này.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/admin/survey/options/reorder:
    post:
      tags: [admin]
      operationId: adminReorderSurveyOptions
      summary: Sắp xếp lại lựa chọn trong một câu hỏi
      description: |
        Yêu cầu `content:manage`. Nhận TOÀN BỘ id của câu hỏi theo thứ tự mới — cùng lý do
        với `/v1/admin/site/nav/reorder`: kết quả không phụ thuộc thứ tự request tới.
      security:
        - webSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderSurveyOptionsRequest'
      responses:
        '204':
          description: Đã sắp xếp lại.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/survey/options/{optionId}:
    patch:
      tags: [admin]
      operationId: adminUpdateSurveyOption
      summary: Sửa icon và nhãn của một lựa chọn
      description: |
        Yêu cầu `content:manage`. KHÔNG sửa được `key` — câu trả lời đã thu thập tham chiếu
        lựa chọn này, và đổi khoá sẽ làm mọi số liệu lịch sử trỏ sai đối tượng.
      security:
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/SurveyOptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSurveyOptionRequest'
      responses:
        '204':
          description: Đã lưu.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [admin]
      operationId: adminDeleteSurveyOption
      summary: Xoá một lựa chọn
      description: |
        Yêu cầu `content:manage`.

        Lựa chọn ĐÃ CÓ NGƯỜI TRẢ LỜI thì KHÔNG xoá được — khoá ngoại `ON DELETE RESTRICT` ở
        `survey_answers` chặn, và API trả 409. Đó là hành vi đúng: xoá nó sẽ làm mọi số liệu
        lịch sử trỏ vào hư không. Muốn gỡ khỏi giao diện thì đổi trạng thái sang `inactive`.
      security:
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/SurveyOptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReason'
      responses:
        '204':
          description: Đã xoá.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Lựa chọn đã có người trả lời — dùng `inactive` thay vì xoá.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/admin/survey/options/{optionId}/status:
    post:
      tags: [admin]
      operationId: adminChangeSurveyOptionStatus
      summary: Đưa lựa chọn ra hoặc gỡ khỏi khảo sát
      description: |
        Yêu cầu `content:publish` — permission RIÊNG, không phải `content:manage`. Cùng lập
        luận với điều hướng site: đưa một lựa chọn sang `active` là đặt nó trước mặt mọi
        người dùng mới đăng ký.

        Chỉ nhận `active` và `inactive`; `draft` không phải đích hợp lệ của chuyển tiếp nào.
      security:
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/SurveyOptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeContentStatusRequest'
      responses:
        '204':
          description: Đã đổi trạng thái.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/survey/summary:
    get:
      tags: [admin]
      operationId: adminGetSurveySummary
      summary: Tổng hợp kết quả khảo sát
      description: |
        Yêu cầu **`survey_response:read`** — permission riêng, KHÔNG phải `content:*`. Sửa
        câu hỏi là việc biên tập; đọc kết quả là truy cập dữ liệu người dùng.

        Đây là thứ trả lời đúng mục đích "thu thập thông tin": mỗi lựa chọn được chọn bao
        nhiêu lần. Danh sách thô chỉ hữu ích khi điều tra một trường hợp cụ thể.

        Không trả `accountId` — tổng hợp không cần biết ai trả lời gì.
      security:
        - webSession: []
      parameters:
        - name: locale
          in: query
          required: true
          description: Ngôn ngữ của nhãn hiển thị trong báo cáo.
          schema:
            type: string
            enum: [vi, en]
      responses:
        '200':
          description: Số liệu tổng hợp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveySummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/survey/responses:
    get:
      tags: [admin]
      operationId: adminListSurveyResponses
      summary: Danh sách lượt trả lời (chi tiết)
      description: |
        Yêu cầu **`survey_response:read`**.

        Trả `accountId` để đối chiếu với màn hình quản trị account khi điều tra một trường
        hợp cụ thể. **Đây là dữ liệu cá nhân** — thời hạn lưu thuộc DEC-B11, chưa chốt.

        Phân trang bằng cursor theo `createdAt`, mới nhất trước — cùng khuôn với
        `/v1/admin/audit`.
      security:
        - webSession: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Danh sách lượt trả lời, mới nhất trước.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SurveyResponseRecord'
                  nextCursor:
                    type: [string, 'null']
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  responses:
    BadRequest:
      description: Dữ liệu vào không hợp lệ (ví dụ thiếu `reason`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Chưa xác thực (thiếu/sai/hết hạn/đã thu hồi phiên).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: |
        Đã xác thực nhưng KHÔNG đủ quyền quản trị. Cố ý không nêu thiếu permission nào —
        tránh vẽ bản đồ phân quyền cho kẻ dò.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Không tìm thấy tài nguyên trong phạm vi được phép.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  securitySchemes:
    webSession:
      type: apiKey
      in: header
      name: X-Session-Token
      description: |
        Web session token do BFF forward (từ cookie HttpOnly). Control Plane tra hash
        trong `web_sessions`, kiểm chưa hết hạn/chưa thu hồi, rồi resolve accountId.
        Token thô KHÔNG được log. Đây là kênh của NGƯỜI DÙNG — khác `serviceIdentity` (M2M).
    userSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token user do Auth0 phát, được BFF chuyển tiếp.
        **CHƯA dùng ở P1** — wiring Auth0 thật là P2 và phụ thuộc DEC-B03 (tenant thật).
    serviceIdentity:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        M2M token của backend ứng dụng (Data Plane). Mỗi backend có identity RIÊNG,
        audience cụ thể và exact resource scope. Không dùng chung credential.
        **CHƯA dùng ở P1.**

  schemas:
    AdminReason:
      type: object
      description: |
        Mọi mutation quản trị BẮT BUỘC có lý do (modular.md mục 11.4). Lý do đi vào audit
        và là thứ khiến bản ghi audit có giá trị điều tra sau này.
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
    # ── Survey (onboarding) ────────────────────────────────────────────────────

    SurveyQuestionKey:
      type: string
      enum: [categories, primary_use, discover_first]
      description: |
        Khoá máy ỔN ĐỊNH. Danh mục ĐÓNG — cấu trúc khảo sát cố định vì code phải có chỗ
        render tương ứng; chỉ nội dung và danh sách lựa chọn sửa được trong `/admin`.

    SurveyIconKey:
      type: string
      description: |
        Khoá icon thuộc danh mục ĐÓNG; code render SVG tương ứng. Không phải URL và không
        phải SVG — CSP theo nonce (DEC-T20) sẽ chặn markup tự nhập, và nới CSP để chiều một
        ô nhập icon 20px là đánh đổi tệ nhất trong kiến trúc này.

        Danh sách này phải khớp CHECK ở migration `0012_survey` VÀ `survey-icons.tsx`.
      enum:
        [
          writing,
          design,
          code,
          video,
          image,
          automation,
          research,
          business,
          chart,
          chat,
          cloud,
          shield,
          sparkle,
          rocket,
          book,
        ]

    OnboardingSurvey:
      type: object
      required: [required, questions]
      additionalProperties: false
      properties:
        required:
          type: boolean
          description: '`false` khi account đã hoàn tất HOẶC đã bỏ qua.'
        questions:
          type: array
          items:
            $ref: '#/components/schemas/SurveyQuestion'

    SurveyQuestion:
      type: object
      required: [key, kind, minSelect, title, description, options]
      additionalProperties: false
      properties:
        key:
          $ref: '#/components/schemas/SurveyQuestionKey'
        kind:
          type: string
          enum: [single, multi]
          description: '`multi` render checkbox, `single` render radio.'
        minSelect:
          type: integer
          minimum: 1
          description: Số lựa chọn tối thiểu. Server kiểm lại, không tin client.
        title: { type: string }
        description: { type: [string, 'null'] }
        options:
          type: array
          items:
            $ref: '#/components/schemas/SurveyOption'

    SurveyOption:
      type: object
      required: [key, label, description, icon]
      additionalProperties: false
      properties:
        key:
          type: string
          description: Ổn định trong phạm vi câu hỏi. Đây là thứ client gửi lại khi nộp.
        label: { type: string }
        description:
          type: [string, 'null']
          description: Câu 1 không có; câu 2 và 3 có một dòng mô tả trong ô.
        icon:
          oneOf:
            - $ref: '#/components/schemas/SurveyIconKey'
            - type: 'null'

    SubmitOnboardingRequest:
      type: object
      required: [status, locale]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [completed, skipped]
        locale:
          type: string
          enum: [vi, en]
          description: Ngôn ngữ lúc trả lời — lưu lại vì nhãn lựa chọn có thể đổi về sau.
        answers:
          type: array
          description: Bắt buộc khi `status = completed`; bị bỏ qua khi `skipped`.
          items:
            type: object
            required: [questionKey, optionKeys]
            additionalProperties: false
            properties:
              questionKey:
                $ref: '#/components/schemas/SurveyQuestionKey'
              optionKeys:
                type: array
                minItems: 1
                items: { type: string }

    OwnSurveyResponse:
      type: object
      required: [status, locale, createdAt, answers]
      additionalProperties: false
      description: |
        Nội dung ĐỌC ĐƯỢC câu trả lời của chính người dùng — khác `SurveyResponseRecord`
        (dành cho admin, chỉ trả khoá thô để tổng hợp/đối chiếu).
      properties:
        status: { type: string, enum: [completed, skipped] }
        locale: { type: string, enum: [vi, en] }
        createdAt: { type: string, format: date-time }
        answers:
          type: array
          description: Rỗng khi `status = skipped`.
          items:
            type: object
            required: [questionKey, questionTitle, selectedOptions]
            additionalProperties: false
            properties:
              questionKey:
                $ref: '#/components/schemas/SurveyQuestionKey'
              questionTitle:
                type: string
                description: Nhãn câu hỏi theo `locale` đã yêu cầu.
              selectedOptions:
                type: array
                items:
                  type: object
                  required: [key, label]
                  additionalProperties: false
                  properties:
                    key: { type: string }
                    label:
                      type: string
                      description: Nhãn lựa chọn theo `locale` đã yêu cầu.

    # ── Survey: quản trị ───────────────────────────────────────────────────────

    AdminSurveyQuestion:
      type: object
      required:
        [id, key, kind, minSelect, sortOrder, status, titles, descriptions, options, updatedAt]
      additionalProperties: false
      description: |
        Khác `SurveyQuestion` ở hai chỗ: trả CẢ HAI ngôn ngữ cùng lúc (màn hình quản trị sửa
        song song), và trả cả lựa chọn `draft`/`inactive` mà người dùng không thấy.
      properties:
        id: { type: string, format: uuid }
        key:
          $ref: '#/components/schemas/SurveyQuestionKey'
        kind: { type: string, enum: [single, multi] }
        minSelect: { type: integer, minimum: 1 }
        sortOrder: { type: integer, minimum: 0 }
        status: { type: string, enum: [active, inactive] }
        titles:
          $ref: '#/components/schemas/LocalizedText'
        descriptions:
          $ref: '#/components/schemas/LocalizedText'
        options:
          type: array
          description: Đã sắp theo `sortOrder`, gồm MỌI trạng thái.
          items:
            $ref: '#/components/schemas/AdminSurveyOption'
        updatedAt: { type: string, format: date-time }

    AdminSurveyOption:
      type: object
      required: [id, key, icon, sortOrder, status, labels, descriptions, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        key:
          type: string
          description: Ổn định trong phạm vi câu hỏi. Không sửa được sau khi tạo.
        icon:
          oneOf:
            - $ref: '#/components/schemas/SurveyIconKey'
            - type: 'null'
        sortOrder: { type: integer, minimum: 0 }
        status: { type: string, enum: [draft, active, inactive] }
        labels:
          $ref: '#/components/schemas/LocalizedText'
        descriptions:
          $ref: '#/components/schemas/LocalizedText'
        updatedAt: { type: string, format: date-time }

    UpdateSurveyQuestionRequest:
      type: object
      required: [reason]
      additionalProperties: false
      description: |
        Trường vắng mặt = không đổi. `titles.vi = null` là XOÁ bản dịch tiếng Việt, khác với
        việc không gửi `titles` (giữ nguyên).
      properties:
        minSelect:
          type: integer
          minimum: 1
          description: |
            Chỉ có nghĩa với câu `multi`. Đặt lớn hơn số lựa chọn `active` hiện có sẽ bị từ
            chối — nếu không, không ai nộp nổi khảo sát.
        titles:
          $ref: '#/components/schemas/LocalizedText'
        descriptions:
          $ref: '#/components/schemas/LocalizedText'
        reason: { type: string, minLength: 1 }

    CreateSurveyOptionRequest:
      type: object
      required: [questionKey, key, labels, reason]
      additionalProperties: false
      properties:
        questionKey:
          $ref: '#/components/schemas/SurveyQuestionKey'
        key:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z0-9_]+$'
          description: |
            Chữ thường, số và gạch dưới. Ràng buộc hình dạng vì đây là khoá máy đi vào dữ
            liệu lịch sử và báo cáo, không phải chữ hiển thị.
        icon:
          oneOf:
            - $ref: '#/components/schemas/SurveyIconKey'
            - type: 'null'
        labels:
          $ref: '#/components/schemas/LocalizedText'
        descriptions:
          $ref: '#/components/schemas/LocalizedText'
        sortOrder:
          type: integer
          minimum: 0
          description: Bỏ trống thì xếp cuối câu hỏi.
        reason: { type: string, minLength: 1 }

    UpdateSurveyOptionRequest:
      type: object
      required: [reason]
      additionalProperties: false
      description: 'Trường vắng mặt = không đổi. `key` KHÔNG sửa được — xem mô tả endpoint.'
      properties:
        icon:
          oneOf:
            - $ref: '#/components/schemas/SurveyIconKey'
            - type: 'null'
        labels:
          $ref: '#/components/schemas/LocalizedText'
        descriptions:
          $ref: '#/components/schemas/LocalizedText'
        reason: { type: string, minLength: 1 }

    ReorderSurveyOptionsRequest:
      type: object
      required: [questionKey, optionIds, reason]
      additionalProperties: false
      properties:
        questionKey:
          $ref: '#/components/schemas/SurveyQuestionKey'
        optionIds:
          type: array
          minItems: 1
          description: TOÀN BỘ id của câu hỏi, theo thứ tự mới. Thiếu hoặc thừa đều bị từ chối.
          items: { type: string, format: uuid }
        reason: { type: string, minLength: 1 }

    SurveySummary:
      type: object
      required: [totalResponses, completedCount, skippedCount, questions]
      additionalProperties: false
      properties:
        totalResponses:
          type: integer
          description: Tổng số lượt, gồm cả bỏ qua.
        completedCount: { type: integer }
        skippedCount:
          type: integer
          description: |
            Có giá trị riêng: tỉ lệ bỏ qua cao nghĩa là khảo sát đang cản đường vào sản phẩm.
        questions:
          type: array
          items:
            type: object
            required: [key, title, respondentCount, options]
            additionalProperties: false
            properties:
              key:
                $ref: '#/components/schemas/SurveyQuestionKey'
              title: { type: [string, 'null'] }
              respondentCount:
                type: integer
                description: |
                  Số NGƯỜI đã trả lời câu này — khác tổng `count` của các lựa chọn ở câu
                  `multi`, vì một người chọn nhiều ô. Thiếu số này thì phần trăm tính sai.
              options:
                type: array
                items:
                  type: object
                  required: [key, label, icon, status, count]
                  additionalProperties: false
                  properties:
                    key: { type: string }
                    label: { type: [string, 'null'] }
                    icon:
                      oneOf:
                        - $ref: '#/components/schemas/SurveyIconKey'
                        - type: 'null'
                    status:
                      type: string
                      enum: [draft, active, inactive]
                      description: |
                        Trả cả trạng thái vì một lựa chọn đã `inactive` vẫn còn số đếm lịch
                        sử. Không hiển thị nó thì con số biến mất; không ghi trạng thái thì
                        người đọc tưởng báo cáo hỏng.
                    count: { type: integer }

    SurveyResponseRecord:
      type: object
      required: [id, accountId, status, locale, createdAt, answers]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        accountId:
          type: string
          format: uuid
          description: Để đối chiếu với màn hình quản trị account khi điều tra một trường hợp.
        status: { type: string, enum: [completed, skipped] }
        locale: { type: string, enum: [vi, en] }
        createdAt: { type: string, format: date-time }
        answers:
          type: array
          description: Rỗng khi `status = skipped`.
          items:
            type: object
            required: [questionKey, optionKeys]
            additionalProperties: false
            properties:
              questionKey:
                $ref: '#/components/schemas/SurveyQuestionKey'
              optionKeys:
                type: array
                description: |
                  KHOÁ chứ không phải nhãn — danh sách thô phải đọc được như nhau bất kể bản
                  dịch hiện tại là gì.
                items: { type: string }

    # ── Site content ───────────────────────────────────────────────────────────

    SiteSettings:
      type: object
      required: [logoUrl]
      additionalProperties: false
      properties:
        logoUrl:
          type: [string, 'null']
          description: |
            URL ảnh logo, hoặc `null` khi chưa đặt. Đã qua chính sách URL và đã chuẩn hoá —
            frontend dùng NGUYÊN chuỗi này, không tự ghép host.

    UploadSiteLogoRequest:
      type: object
      required: [mime, data, reason]
      additionalProperties: false
      properties:
        mime:
          type: string
          enum: [image/png, image/jpeg, image/webp]
        data:
          type: string
          description: Bytes của ảnh, mã hoá base64. Trần 512KB sau giải mã.
        reason: { type: string, minLength: 1 }

    UpdateSiteSettingsRequest:
      type: object
      required: [reason]
      additionalProperties: false
      description: >-
        Trường vắng mặt = không đổi. `logoUrl` bằng `null` = xoá logo.
      properties:
        logoUrl: { type: [string, 'null'] }
        reason: { type: string, minLength: 1 }

    ContentSlotKey:
      type: string
      description: |
        Khoá khe nội dung — danh mục ĐÓNG, khớp CHECK ở migration `0013_content_slots`.
        Khoá là ĐƯỜNG DẪN trong message catalog của web (trừ nhóm `seo.description.*`
        không có bản dự phòng); một khe không có chỗ render trong code là dữ liệu chết,
        nên thêm khe = migration + code, không phải việc admin làm được.
      enum:
        - home.heroTitle
        - home.heroLead
        - home.statToolCount
        - home.statCategoryCount
        - home.statUpdated
        - home.toolsTitle
        - home.toolsLead
        - home.categoriesTitle
        - home.whatsNewTitle
        - home.whatsNewLead
        - home.blogTitle
        - home.faqTitle
        - home.faqLead
        - tools.title
        - tools.lead
        - blog.title
        - blog.lead
        - blog.latestTitle
        - blog.featuredTitle
        - blog.trendingTitle
        - comingSoon.categoriesTitle
        - comingSoon.categoriesDescription
        - comingSoon.contactTitle
        - comingSoon.contactDescription
        - comingSoon.submitTitle
        - comingSoon.submitDescription
        - footer.tagline
        - newsletter.title
        - newsletter.text
        - meta.home
        - meta.tools
        - meta.blog
        - meta.categories
        - meta.contact
        - meta.submit
        - seo.description.home
        - seo.description.tools
        - seo.description.blog
        - seo.description.categories
        - seo.description.contact
        - seo.description.submit
        - legal.terms
        - legal.privacy

    SiteContent:
      type: object
      required: [locale, values]
      additionalProperties: false
      properties:
        locale: { type: string, enum: [vi, en] }
        values:
          type: object
          description: |
            Chỉ chứa khoá ĐÃ ĐẶT. Khoá vắng mặt = web dùng chữ mặc định trong code.
          additionalProperties: { type: string }

    AdminContentSlot:
      type: object
      required: [key, values, updatedAt]
      additionalProperties: false
      properties:
        key:
          $ref: '#/components/schemas/ContentSlotKey'
        values:
          $ref: '#/components/schemas/LocalizedText'
        updatedAt: { type: string, format: date-time }

    UpdateContentSlotRequest:
      type: object
      required: [values, reason]
      additionalProperties: false
      properties:
        values:
          $ref: '#/components/schemas/LocalizedText'
        reason: { type: string, minLength: 1 }

    NavMenuKey:
      type: string
      description: |
        Vị trí đặt menu trên giao diện. Danh mục ĐÓNG: thêm một vị trí đòi code phải có chỗ
        render nó, nên đó là migration chứ không phải dữ liệu người biên tập tạo.
      enum:
        - header.primary
        - footer.explore
        - footer.about
        - footer.resources

    SiteNav:
      type: object
      required: [locale, menus]
      additionalProperties: false
      description: Toàn bộ điều hướng cho MỘT ngôn ngữ, gom theo menu.
      properties:
        locale: { type: string, enum: [vi, en] }
        menus:
          type: array
          items:
            type: object
            required: [key, items]
            additionalProperties: false
            properties:
              key:
                $ref: '#/components/schemas/NavMenuKey'
              items:
                type: array
                description: Đã sắp theo `sortOrder`. Client render nguyên thứ tự này.
                items:
                  type: object
                  required: [id, label, href]
                  additionalProperties: false
                  properties:
                    id: { type: string, format: uuid }
                    label:
                      type: string
                      description: Nhãn theo ngôn ngữ yêu cầu. Text thuần, KHÔNG phải HTML.
                    href:
                      type: string
                      description: |
                        Đường dẫn nội bộ (`/tools`) hoặc URL ngoài (`https://…`).

                        KHÔNG mang prefix locale: web tự gắn `/vi` hoặc `/en` lúc render
                        theo ngôn ngữ đang xem. Lưu sẵn prefix sẽ khiến cùng một mục phải
                        tồn tại hai bản.

    AdminNavItem:
      type: object
      required: [id, menuKey, sortOrder, href, status, labels, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        menuKey:
          $ref: '#/components/schemas/NavMenuKey'
        sortOrder: { type: integer, minimum: 0 }
        href: { type: string }
        status: { type: string, enum: [draft, active, inactive] }
        labels:
          $ref: '#/components/schemas/LocalizedText'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    LocalizedText:
      type: object
      description: |
        Một đoạn văn bản theo từng ngôn ngữ. Dùng chung cho điều hướng site và khảo sát —
        cùng một hình dạng, cùng một quy tắc, nên không tách làm hai.

        Thiếu một ngôn ngữ là hợp lệ ở trạng thái `draft` — nhưng mục đó sẽ bị BỎ QUA ở
        đường công khai của ngôn ngữ còn thiếu (join INNER, không fallback).
      additionalProperties: false
      properties:
        vi: { type: [string, 'null'] }
        en: { type: [string, 'null'] }

    CreateNavItemRequest:
      type: object
      required: [menuKey, href, labels, reason]
      additionalProperties: false
      properties:
        menuKey:
          $ref: '#/components/schemas/NavMenuKey'
        href: { type: string, minLength: 1 }
        labels:
          $ref: '#/components/schemas/LocalizedText'
        sortOrder:
          type: integer
          minimum: 0
          description: Bỏ trống thì xếp cuối menu.
        reason: { type: string, minLength: 1 }

    UpdateNavItemRequest:
      type: object
      required: [reason]
      additionalProperties: false
      description: |
        Trường vắng mặt = không đổi. `labels.vi = null` là XOÁ bản dịch tiếng Việt, khác với
        việc không gửi `labels` (giữ nguyên).
      properties:
        href: { type: string, minLength: 1 }
        labels:
          $ref: '#/components/schemas/LocalizedText'
        reason: { type: string, minLength: 1 }

    ChangeContentStatusRequest:
      type: object
      required: [status, reason]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [active, inactive]
          description: '`draft` không phải đích hợp lệ — xem mô tả endpoint.'
        reason: { type: string, minLength: 1 }

    ReorderNavRequest:
      type: object
      required: [menuKey, itemIds, reason]
      additionalProperties: false
      properties:
        menuKey:
          $ref: '#/components/schemas/NavMenuKey'
        itemIds:
          type: array
          minItems: 1
          description: TOÀN BỘ id của menu, theo thứ tự mới. Thiếu hoặc thừa đều bị từ chối.
          items: { type: string, format: uuid }
        reason: { type: string, minLength: 1 }

    PublicApplication:
      type: object
      required: [id, key, displayName, description, imageUrl, launchUrl]
      description: |
        View cho nguoi dung cuoi. CO Y khong co `status`: nguoi dung chi thay app `active`,
        nen truong do khong mang thong tin gi ngoai viec lo ra he thong co trang thai khac.
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        displayName: { type: string }
        description: { type: [string, 'null'] }
        imageUrl: { type: [string, 'null'] }
        launchUrl:
          type: string
          description: |
            Da qua chinh sach URL va da chuan hoa. Frontend dung NGUYEN chuoi nay, khong
            ghep host/path tu input nguoi dung.

    AdminApplication:
      type: object
      required: [id, key, displayName, description, imageUrl, launchUrl, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        displayName: { type: string }
        description: { type: [string, 'null'] }
        imageUrl: { type: [string, 'null'] }
        launchUrl: { type: string }
        status: { type: string, enum: [draft, active, inactive] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RedirectUri:
      type: object
      required: [id, purpose, uri, createdAt]
      properties:
        id: { type: string, format: uuid }
        purpose: { type: string, enum: [login, logout] }
        uri:
          type: string
          description: Da chuan hoa. So khop CHINH XAC tung ky tu, khong wildcard.
        createdAt: { type: string, format: date-time }

    Feature:
      type: object
      required: [id, key, displayName, description, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        key:
          type: string
          description: On dinh trong PHAM VI application va bat bien. Entitlement (P4) tham chieu no.
        displayName: { type: string }
        description: { type: [string, 'null'] }
        status: { type: string, enum: [draft, active, inactive] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AuditEvent:
      type: object
      required: [id, action, actorType, actorAccountId, targetType, targetId, reason, createdAt]
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        actorType:
          type: string
          enum: [account, system]
          description: |
            `system` nghia la he thong tu lam (provisioning, script van hanh) - KHONG phai
            mot nguoi. Gan nham trach nhiem cho nguoi la ket qua te nhat cua audit log.
        actorAccountId: { type: [string, 'null'], format: uuid }
        targetType: { type: string }
        targetId: { type: [string, 'null'], format: uuid }
        reason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    AdminRole:
      type: object
      required: [id, key, displayName, description, status, permissions]
      properties:
        id: { type: string, format: uuid }
        key:
          type: string
          description: Machine key on dinh. Code tham chieu key, khong tham chieu displayName.
        displayName: { type: string }
        description: { type: [string, 'null'] }
        status: { type: string, enum: [active, inactive] }
        permissions:
          type: array
          items: { type: string }

    AdminAssignment:
      type: object
      required: [id, accountId, accountEmail, accountDisplayName, roleId, roleKey, validFrom, validUntil, reason, revokedAt]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        accountEmail: { type: [string, 'null'] }
        accountDisplayName: { type: [string, 'null'] }
        roleId: { type: string, format: uuid }
        roleKey: { type: string }
        validFrom: { type: string, format: date-time }
        validUntil: { type: [string, 'null'], format: date-time }
        reason: { type: string }
        revokedAt:
          type: [string, 'null']
          format: date-time
          description: Khac null nghia la da thu hoi. Dong van giu de doi soat lich su.

    AdminAccount:
      type: object
      description: View account cho admin — có thêm `disabledAt` so với view của user.
      required: [id, status, emailVerified, disabledAt, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, active, disabled]
        displayName:
          type: [string, 'null']
        email:
          type: [string, 'null']
        emailVerified:
          type: boolean
        disabledAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    SessionSummary:
      type: object
      description: |
        Metadata một phiên đăng nhập. CỐ Ý không có `session_token_hash` hay bất kỳ dạng
        token nào — hash không bao giờ rời khỏi database.
      required: [id, createdAt, lastSeenAt, expiresAt, revokedAt, current]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: [string, 'null']
          format: date-time
        current:
          type: boolean
          description: Phiên đang dùng để gọi request này (UI cảnh báo trước khi tự thu hồi).
    OwnAccount:
      type: object
      description: |
        Hồ sơ account trả cho chính user. CỐ Ý không có trường quản trị nội bộ
        (disabled_at, updated_at) — user chỉ thấy hồ sơ, không thấy dữ liệu vận hành.
      required: [id, status, emailVerified, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, active, disabled]
        displayName:
          type: [string, 'null']
        email:
          type: [string, 'null']
        emailVerified:
          type: boolean
        locale:
          type: [string, 'null']
        timezone:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
    ErrorEnvelope:
      type: object
      description: |
        Hình dạng lỗi ổn định cho MỌI lỗi rời khỏi API, kể cả lỗi không lường trước.

        Ràng buộc bảo mật: không bao giờ chứa stack trace, secret, connection string
        hay chi tiết nội bộ. Với lỗi 5xx, `message` luôn là thông điệp chung — chi tiết
        thật chỉ đi vào log phía server, truy được bằng `correlationId`.
      required: [code, message, correlationId]
      additionalProperties: false
      properties:
        code:
          type: string
          description: |
            Mã máy đọc được, ổn định, không phụ thuộc câu chữ giao diện.
            Client bắt lỗi theo trường này.
          pattern: '^[A-Z][A-Z0-9_]*$'
          examples:
            - INTERNAL_ERROR
            - VALIDATION_FAILED
            - SERVICE_UNAVAILABLE
        message:
          type: string
          description: Thông điệp an toàn để hiển thị.
          maxLength: 500
        correlationId:
          type: string
          format: uuid
          description: |
            Truy vết xuyên BFF -> API -> worker -> log.
            Nhận từ header `X-Correlation-Id` nếu hợp lệ, ngược lại server sinh mới (UUIDv7).
            **Không phải** idempotency key — đừng dùng lẫn.
        details:
          type: object
          description: Chi tiết bổ sung theo allowlist. Không bao giờ chứa dữ liệu nhạy cảm.
          additionalProperties: true

