                type: array
                items:
                  $ref: '#/components/schemas/Feature'
        '403':
          description: Thieu permission `catalog:read`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags: [admin]
      operationId: adminCreateFeature
      summary: Tao feature moi
      description: |
        Yeu cau `catalog:manage`. Feature moi luon o trang thai `draft`.

        Feature la thu ma ENTITLEMENT o P4 se cap quyen len: plan khong cap "toan bo app A"
        ma cap tung feature. Vi vay `key` cua feature cung BAT BIEN, cung ly do voi `key`
        cua application.

        `key` on dinh TRONG PHAM VI app — hai app khac nhau duoc phep trung key.
      security:
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, displayName, reason]
              properties:
                key:
                  type: string
                  maxLength: 64
                  pattern: '^[a-z][a-z0-9-]*$'
                displayName: { type: string, maxLength: 120 }
                description: { type: [string, 'null'], maxLength: 2000 }
                reason: { type: string, minLength: 1 }
      responses:
        '201':
          description: Da tao, o trang thai `draft`.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        '400':
          description: '`key` sai dinh dang hoac thieu `reason`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Thieu permission `catalog:manage`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Khong tim thay ung dung.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: '`key` da ton tai TRONG ung dung nay.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/admin/catalog/applications/{applicationId}/features/{featureId}:
    patch:
      tags: [admin]
      operationId: adminUpdateFeature
      summary: Sua metadata feature
