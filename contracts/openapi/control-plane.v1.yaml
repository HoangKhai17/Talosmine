openapi: 3.1.0

# NGUỒN SỰ THẬT của Control Plane API (DEC-T07).
#
# Đây là file VIẾT TAY. Nó không được sinh ra từ code.
# Thứ tự bắt buộc: sửa file này -> `pnpm openapi:lint` -> `pnpm openapi:types` ->
# commit type đã sinh -> rồi mới implement.
#
# Vì sao spec-first chứ không code-first (@nestjs/swagger):
# build plan yêu cầu CONTRACT FREEZE TRƯỚC khi ba lane frontend/backend/tester chạy
# song song. Code-first sẽ đảo ngược thứ tự đó — spec chỉ tồn tại sau khi code xong,
# nên không có gì để freeze, và frontend buộc phải đoán API.
#
# `pnpm openapi:drift` chặn việc spec và type đã commit lệch nhau.
#
# PHẠM VI P1: chỉ health. Mọi endpoint nghiệp vụ (identity, catalog, plan, quota)
# thuộc P2+ và CHƯA tồn tại — không khai ở đây để tránh mô tả thứ không có.

info:
  title: Talosmine Control Plane API
  version: 1.0.0
  description: |
    Control Plane của Talosmine — nguồn sự thật về identity, entitlement và quota.

    **Trạng thái: P1 (bootstrap).** Chỉ có health endpoint. Không có capability nghiệp vụ nào.

    Quy ước xuyên phase:
    - Số lượng (quantity/limit/counter/amount) biểu diễn bằng **decimal string**, không phải
      JSON number — PostgreSQL dùng `bigint` và JSON number mất chính xác ngoài 2^53.
    - Thời gian dùng timestamp có timezone; business time dựa DB clock.
    - Mọi lỗi trả về `ErrorEnvelope` với `code` máy đọc được. Client bắt theo `code`,
      không theo `message`.
  license:
    name: UNLICENSED

servers:
  - url: https://talosmine.localhost
    description: Local dev qua Caddy (DEC-T11)

tags:
  - name: health
    description: |
      Endpoint hạ tầng cho orchestrator và reverse proxy.
      Nằm NGOÀI versioning `/v1` vì nó không phải API nghiệp vụ có contract với client.
  - name: auth
    description: |
      Cầu nối giữa OIDC và phiên nội bộ. BFF chạy luồng Authorization Code với IdP rồi đổi
      `id_token` lấy session token của Talosmine tại đây.

      Control Plane TỰ xác minh chữ ký token bằng JWKS — không tin claim do caller khai.
      Phiên là của Talosmine, không phải của IdP: nhờ vậy nó thu hồi được, liệt kê được và
      có audit. Xem `docs/identity-provider.md`.
  - name: account
    description: |
      API tài khoản của chính user (self-service). Bảo vệ bằng web session:
      BFF forward session token qua header `X-Session-Token`; Control Plane resolve
      accountId phía server, KHÔNG tin accountId do client khai.
  - name: admin
    description: |
      API quản trị. DENY-BY-DEFAULT: cần phiên hợp lệ **và** permission tương ứng qua
      RBAC (role còn `active`, assignment còn hiệu lực và chưa thu hồi). Mọi mutation
      bắt buộc có `reason` và ghi audit đồng bộ trong cùng transaction.

paths:
  /health/live:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Liveness probe
      description: |
        Process và event loop còn đáp ứng hay không. **KHÔNG chạm database.**

        Vì sao không chạm DB: liveness quyết định việc RESTART container. Nếu nó phụ thuộc
        DB thì một sự cố DB sẽ làm restart hàng loạt app vốn đang khoẻ — biến sự cố một
        thành phần thành sự cố toàn hệ thống. Dùng `/health/ready` cho việc kiểm dependency.
      security: []
      responses:
        '200':
          description: Process còn sống.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status:
                    type: string
                    const: ok
              example:
                status: ok

  /health/ready:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness probe
      description: |
        Có nên nhận traffic không. **CÓ** kiểm tra dependency bắt buộc (database).

        DB chết -> trả 503 -> ngừng nhận traffic, nhưng container KHÔNG bị restart.

        Response cố ý tối giản: không lộ host DB, version, connection string hay chi tiết
        dependency nào. Health endpoint không được trở thành công cụ do thám topology.
      security: []
      responses:
        '200':
          description: Sẵn sàng nhận traffic.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status:
                    type: string
                    const: ready
              example:
                status: ready
        '503':
          description: Dependency chưa sẵn sàng. Không nhận traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: SERVICE_UNAVAILABLE
                message: Dependency chưa sẵn sàng.
                correlationId: 018f3a2b-7c4d-7000-8000-000000000000

  /v1/auth/sessions:
    post:
      tags: [auth]
      operationId: exchangeIdTokenForSession
      summary: Đổi ID token của IdP lấy phiên Talosmine
      description: |
        Cầu nối giữa OIDC và phiên nội bộ. BFF chạy luồng Authorization Code với IdP rồi
        gửi NGUYÊN `id_token` tới đây.

        Control Plane **tự xác minh chữ ký** bằng JWKS của issuer — nó không nhận
        `issuer`/`subject`/`accountId` do caller khai. Nếu tin claim của caller thì bất kỳ
        ai gọi được endpoint này đều mạo danh được người khác.

        Sau khi xác minh: tìm hoặc tạo account theo `(issuer, subject)`, kiểm trạng thái
        account, rồi phát session token. Endpoint này KHÔNG cần phiên có sẵn.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              additionalProperties: false
              properties:
                idToken:
                  type: string
                  description: ID token JWT do IdP phát.
      responses:
        '201':
          description: Đã tạo phiên.
          content:
            application/json:
              schema:
                type: object
                required: [sessionToken, csrfToken, expiresAt, accountId, created]
                properties:
                  sessionToken:
                    type: string
                    description: Token thô. Chỉ trả về MỘT LẦN; DB chỉ lưu hash.
                  csrfToken:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
                  accountId:
                    type: string
                    format: uuid
                  created:
                    type: boolean
                    description: true nếu account vừa được tạo lần đầu.
        '400':
          description: Thiếu `idToken`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token không hợp lệ — sai chữ ký, hết hạn, sai issuer hoặc sai audience.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: |
            Account không ở trạng thái `active`. Thông điệp cố ý chung chung, không phân
            biệt `pending` với `disabled`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/auth/sessions/current:
    delete:
      tags: [auth]
      operationId: logout
      summary: Đăng xuất — thu hồi phiên hiện tại
      description: |
        Thu hồi đúng phiên đang dùng để gọi request này. `sessionId` lấy từ session token
        phía server, không phải từ body — không ai đăng xuất hộ người khác được.

        Khác `DELETE /v1/me/account/sessions/all` (đăng xuất mọi thiết bị): đây chỉ là
        thiết bị hiện tại.
      security:
        - webSession: []
      responses:
        '204':
          description: Đã thu hồi (idempotent — gọi lại không lỗi).
        '401':
          description: Thiếu phiên hoặc phiên không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Thiếu hoặc sai CSRF token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/me/permissions:
    get:
      tags: [account]
      operationId: getOwnPermissions
      summary: Permission quản trị của chính mình
      description: |
        Danh sách rỗng nghĩa là không phải admin. Frontend dùng để quyết định có hiện khu
        vực `/admin` hay không.

        Đây thuần túy là UX — mọi endpoint admin vẫn tự kiểm quyền phía server, nên
        endpoint này có nói dối cũng không cấp thêm quyền nào.
      security:
        - webSession: []
      responses:
        '200':
          description: Danh sách permission còn hiệu lực.
          content:
            application/json:
              schema:
                type: object
                required: [permissions]
                properties:
                  permissions:
                    type: array
                    items:
                      type: string
        '401':
          description: Thiếu phiên hoặc phiên không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/me/account:
    patch:
      tags: [account]
      operationId: updateOwnAccount
      summary: Sửa hồ sơ của chính mình
      description: |
        ALLOWLIST ba trường: `displayName`, `locale`, `timezone`. Trường ngoài danh sách bị
        BỎ QUA im lặng — client cũ gửi thừa vẫn chạy, mà field đó vẫn vô tác dụng.

        `status` chỉ admin đổi qua endpoint riêng có audit. `email` và `emailVerified` do
        IdP sở hữu — tự khai ở đây là tự phong "đã xác minh".

        Chuỗi rỗng nghĩa là XÓA giá trị (lưu NULL), không lưu chuỗi rỗng.
      security:
        - webSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: [string, 'null']
                  maxLength: 100
                locale:
                  type: [string, 'null']
                  maxLength: 35
                timezone:
                  type: [string, 'null']
                  maxLength: 64
      responses:
        '200':
          description: Hồ sơ sau khi cập nhật.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnAccount'
        '400':
          description: Giá trị sai kiểu hoặc vượt độ dài cho phép.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Thiếu phiên hoặc phiên không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Thiếu hoặc sai CSRF token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      tags: [account]
      operationId: getOwnAccount
      summary: Xem tài khoản của chính mình
      description: |
        Trả hồ sơ của account gắn với phiên hiện tại. accountId được Control Plane resolve
        từ session token phía server — không có tham số path/query/body nào cho phép hỏi
        account của người khác.
      security:
        - webSession: []
      responses:
        '200':
          description: Hồ sơ account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnAccount'
        '401':
          description: Thiếu phiên, phiên sai, hết hạn hoặc đã thu hồi (fail-closed, không phân biệt lý do).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/me/account/sessions:
    get:
      tags: [account]
      operationId: listOwnSessions
      summary: Liệt kê phiên đăng nhập của chính mình
      description: |
        Trả các phiên của account hiện tại (trang "thiết bị đang đăng nhập").
        KHÔNG trả hash token — chỉ metadata đủ để user nhận ra phiên nào là phiên nào.
      security:
        - webSession: []
      responses:
        '200':
          description: Danh sách phiên.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionSummary'
        '401':
          description: Không có phiên hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/me/account/sessions/all:
    delete:
      tags: [account]
      operationId: revokeAllOwnSessions
      summary: Đăng xuất mọi nơi
      description: |
        Thu hồi TẤT CẢ phiên còn hiệu lực của account, kể cả phiên đang gọi request này.
        Idempotent: gọi lại khi không còn phiên nào vẫn trả 204.
      security:
        - webSession: []
      responses:
        '204':
          description: Đã thu hồi (không có nội dung trả về).
        '401':
          description: Không có phiên hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/me/account/sessions/{sessionId}:
    delete:
      tags: [account]
      operationId: revokeOwnSession
      summary: Thu hồi một phiên của chính mình
      description: |
        Chỉ thu hồi được phiên THUỘC account hiện tại. Phiên của người khác, phiên không
        tồn tại, và phiên đã thu hồi đều trả 404 giống nhau — không tiết lộ sessionId nào
        là có thật (chống dò).
      security:
        - webSession: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Đã thu hồi.
        '400':
          description: sessionId không phải UUID hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Không có phiên hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Không tìm thấy phiên thuộc account này.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/admin/audit:
    get:
      tags: [admin]
      operationId: adminListAuditEvents
      summary: Tra cuu nhat ky kiem toan
      description: |
        Yeu cau permission `audit:read`.

        CHI DOC, va khong the khac: bang `audit_events` bi trigger o tang database chan moi
        `UPDATE`/`DELETE`, con runtime role khong duoc cap `TRUNCATE`. Ba lop do doc lap
        nhau, nen API khong co duong sua vi ha tang ben duoi cung khong cho phep.

        Khong tra cot `details` - truong do co the chua du lieu chua loc.
      security:
        - webSession: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: targetId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Danh sach su kien, moi nhat truoc.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'
                  nextCursor:
                    type: [string, 'null']
                    format: date-time
        '401':
          description: Thieu phien hoac phien khong hop le.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Thieu permission `audit:read`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/admin/rbac/roles:
    get:
      tags: [admin]
      operationId: adminListRoles
      summary: Danh sach vai tro quan tri
      description: |
        Yeu cau `admin_role:manage` - ke ca duong doc. Biet ai dang co quyen gi la thong tin
        nhay cam: no cho biet nen tan cong tai khoan nao.
      security:
        - webSession: []
      responses:
        '200':
          description: Vai tro kem permission cua tung vai tro.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminRole'
        '401':
          description: Thieu phien hoac phien khong hop le.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Thieu permission `admin_role:manage`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/admin/rbac/permissions:
    get:
      tags: [admin]
      operationId: adminListPermissionCatalog
      summary: Danh muc permission he thong ho tro
      description: |
        Danh muc DONG, khoa bang CHECK trong migration 0005. Tra ve hang so chu khong doc
        DB - nghia la giao dien khong bao gio hien mot permission ma database se tu choi.
      security:
        - webSession: []
      responses:
        '200':
          description: Danh muc permission.
          content:
            application/json:
              schema:
                type: object
                required: [permissions]
                properties:
                  permissions:
                    type: array
                    items: { type: string }
        '403':
          description: Thieu permission `admin_role:manage`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/admin/rbac/assignments:
    get:
      tags: [admin]
      operationId: adminListAssignments
      summary: Danh sach phan quyen da cap
      description: |
        Gom ca assignment DA THU HOI. Lich su "ai tung co quyen gi, trong khoang nao, ai thu
        hoi" la toan bo gia tri cua bang nay.
      security:
        - webSession: []
      responses:
        '200':
          description: Danh sach phan quyen.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminAssignment'
        '403':
          description: Thieu permission `admin_role:manage`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags: [admin]
      operationId: adminAssignRole
      summary: Cap vai tro cho mot tai khoan
      description: |
        CHOT CHAN LEO THANG DAC QUYEN: nguoi goi phai TU CO moi permission cua vai tro duoc
        cap. Thieu rang buoc nay thi mot admin quyen thap co the tu nang minh len toan quyen
        qua hai buoc, va moi gioi han quyen khac deu vo nghia.

        Ghi assignment va audit trong CUNG mot transaction.
      security:
        - webSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId, accountId, reason]
              properties:
                roleId: { type: string, format: uuid }
                accountId: { type: string, format: uuid }
                reason:
                  type: string
                  minLength: 1
                validUntil:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Da cap.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        '400':
          description: Thieu `reason`, ID sai dinh dang, hoac vai tro dang bi vo hieu hoa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: |
            Thieu permission `admin_role:manage`, HOAC dang co cap quyen ma chinh minh
            khong co.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Khong tim thay vai tro hoac tai khoan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Tai khoan da co vai tro nay va con hieu luc.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/admin/rbac/assignments/{assignmentId}:
    delete:
      tags: [admin]
      operationId: adminRevokeAssignment
      summary: Thu hoi mot phan quyen
      description: |
        Thu hoi = ghi ba cot `revoked_*`, KHONG xoa dong.

        Request mang BODY du la `DELETE`: `reason` bat buoc cho nhat ky kiem toan, va HTTP
        khong cam `DELETE` co body.
      security:
        - webSession: []
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        '204':
          description: Da thu hoi.
        '400':
          description: Thieu `reason`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Thieu permission `admin_role:manage`, hoac thieu/sai CSRF token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Khong tim thay phan quyen dang hieu luc.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/admin/accounts:
    get:
      tags: [admin]
      operationId: adminSearchAccounts
      summary: Tìm account (quản trị)
      description: |
        Yêu cầu permission `account:read`.

        CHỐNG DÒ DỮ LIỆU: `query` rỗng trả về danh sách RỖNG, không trả toàn bộ account.
        Đây là công cụ tra một người cụ thể, không phải để tải danh bạ người dùng.

        Phân trang theo cursor (`createdAt` giảm dần), không dùng offset: offset lớn càng
        sâu càng chậm, và bản ghi chèn vào giữa lúc lật trang sẽ gây nhảy hoặc lặp.
      security:
        - webSession: []
      parameters:
        - name: query
          in: query
          required: false
          schema: { type: string }
          description: Email, tên hiển thị (khớp một phần) hoặc UUID account (khớp chính xác).
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Giá trị `nextCursor` của trang trước.
      responses:
        '200':
          description: Kết quả tìm kiếm.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminAccount'
                  nextCursor:
                    type: [string, 'null']
                    format: date-time
        '401':
          description: Thiếu phiên hoặc phiên không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Thiếu permission `account:read`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/admin/accounts/{accountId}/sessions:
    get:
      tags: [admin]
      operationId: adminListAccountSessions
      summary: Liệt kê phiên của một account (quản trị)
      description: |
        Yêu cầu permission `session:revoke` — KHÔNG phải `account:read`. Nhìn thấy thiết bị
        và thời điểm hoạt động của người khác là dữ liệu nhạy cảm, và người xem danh sách
        này chính là người sẽ quyết định thu hồi.

        KHÔNG trả token hay hash dưới bất kỳ dạng nào.
      security:
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Metadata phiên.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, createdAt, lastSeenAt, expiresAt, revokedAt]
                  properties:
                    id: { type: string, format: uuid }
                    createdAt: { type: string, format: date-time }
                    lastSeenAt: { type: string, format: date-time }
                    expiresAt: { type: string, format: date-time }
                    revokedAt: { type: [string, 'null'], format: date-time }
        '401':
          description: Thiếu phiên hoặc phiên không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Thiếu permission `session:revoke`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/admin/accounts/{accountId}:
    get:
      tags: [admin]
      operationId: adminGetAccount
      summary: Xem account bất kỳ (quản trị)
      description: |
        Yêu cầu permission `account:read`. Trả nhiều trường hơn view của user (có `disabledAt`).
      security:
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/accounts/{accountId}/disable:
    post:
      tags: [admin]
      operationId: adminDisableAccount
      summary: Vô hiệu hóa account
      description: |
        Yêu cầu permission `account:disable`. Trong MỘT transaction: đổi status sang
        `disabled`, **thu hồi mọi phiên** của user đó, và ghi audit. Thất bại ở bất kỳ
        bước nào rollback cả ba.
      security:
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReason'
      responses:
        '204':
          description: Đã vô hiệu hóa.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/accounts/{accountId}/enable:
    post:
      tags: [admin]
      operationId: adminEnableAccount
      summary: Kích hoạt lại account đã bị vô hiệu hóa
      description: |
        Yêu cầu permission `account:enable` — TÁCH RIÊNG khỏi `account:disable` vì
        `disabled -> active` là hành động nhạy cảm hơn. Reason bắt buộc, audit đồng bộ.
      security:
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReason'
      responses:
        '204':
          description: Đã kích hoạt lại.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/accounts/{accountId}/revoke-sessions:
    post:
      tags: [admin]
      operationId: adminRevokeAccountSessions
      summary: Thu hồi toàn bộ phiên của một account
      description: |
        Yêu cầu permission `session:revoke`. Dùng khi nghi ngờ tài khoản bị chiếm.
        Idempotent — không còn phiên nào vẫn trả 204.
      security:
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReason'
      responses:
        '204':
          description: Đã thu hồi.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  responses:
    BadRequest:
      description: Dữ liệu vào không hợp lệ (ví dụ thiếu `reason`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Chưa xác thực (thiếu/sai/hết hạn/đã thu hồi phiên).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: |
        Đã xác thực nhưng KHÔNG đủ quyền quản trị. Cố ý không nêu thiếu permission nào —
        tránh vẽ bản đồ phân quyền cho kẻ dò.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Không tìm thấy tài nguyên trong phạm vi được phép.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  securitySchemes:
    webSession:
      type: apiKey
      in: header
      name: X-Session-Token
      description: |
        Web session token do BFF forward (từ cookie HttpOnly). Control Plane tra hash
        trong `web_sessions`, kiểm chưa hết hạn/chưa thu hồi, rồi resolve accountId.
        Token thô KHÔNG được log. Đây là kênh của NGƯỜI DÙNG — khác `serviceIdentity` (M2M).
    userSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token user do Auth0 phát, được BFF chuyển tiếp.
        **CHƯA dùng ở P1** — wiring Auth0 thật là P2 và phụ thuộc DEC-B03 (tenant thật).
    serviceIdentity:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        M2M token của backend ứng dụng (Data Plane). Mỗi backend có identity RIÊNG,
        audience cụ thể và exact resource scope. Không dùng chung credential.
        **CHƯA dùng ở P1.**

  schemas:
    AdminReason:
      type: object
      description: |
        Mọi mutation quản trị BẮT BUỘC có lý do (modular.md mục 11.4). Lý do đi vào audit
        và là thứ khiến bản ghi audit có giá trị điều tra sau này.
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
    AuditEvent:
      type: object
      required: [id, action, actorType, actorAccountId, targetType, targetId, reason, createdAt]
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        actorType:
          type: string
          enum: [account, system]
          description: |
            `system` nghia la he thong tu lam (provisioning, script van hanh) - KHONG phai
            mot nguoi. Gan nham trach nhiem cho nguoi la ket qua te nhat cua audit log.
        actorAccountId: { type: [string, 'null'], format: uuid }
        targetType: { type: string }
        targetId: { type: [string, 'null'], format: uuid }
        reason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    AdminRole:
      type: object
      required: [id, key, displayName, description, status, permissions]
      properties:
        id: { type: string, format: uuid }
        key:
          type: string
          description: Machine key on dinh. Code tham chieu key, khong tham chieu displayName.
        displayName: { type: string }
        description: { type: [string, 'null'] }
        status: { type: string, enum: [active, inactive] }
        permissions:
          type: array
          items: { type: string }

    AdminAssignment:
      type: object
      required: [id, accountId, accountEmail, accountDisplayName, roleId, roleKey, validFrom, validUntil, reason, revokedAt]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        accountEmail: { type: [string, 'null'] }
        accountDisplayName: { type: [string, 'null'] }
        roleId: { type: string, format: uuid }
        roleKey: { type: string }
        validFrom: { type: string, format: date-time }
        validUntil: { type: [string, 'null'], format: date-time }
        reason: { type: string }
        revokedAt:
          type: [string, 'null']
          format: date-time
          description: Khac null nghia la da thu hoi. Dong van giu de doi soat lich su.

    AdminAccount:
      type: object
      description: View account cho admin — có thêm `disabledAt` so với view của user.
      required: [id, status, emailVerified, disabledAt, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, active, disabled]
        displayName:
          type: [string, 'null']
        email:
          type: [string, 'null']
        emailVerified:
          type: boolean
        disabledAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    SessionSummary:
      type: object
      description: |
        Metadata một phiên đăng nhập. CỐ Ý không có `session_token_hash` hay bất kỳ dạng
        token nào — hash không bao giờ rời khỏi database.
      required: [id, createdAt, lastSeenAt, expiresAt, revokedAt, current]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: [string, 'null']
          format: date-time
        current:
          type: boolean
          description: Phiên đang dùng để gọi request này (UI cảnh báo trước khi tự thu hồi).
    OwnAccount:
      type: object
      description: |
        Hồ sơ account trả cho chính user. CỐ Ý không có trường quản trị nội bộ
        (disabled_at, updated_at) — user chỉ thấy hồ sơ, không thấy dữ liệu vận hành.
      required: [id, status, emailVerified, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, active, disabled]
        displayName:
          type: [string, 'null']
        email:
          type: [string, 'null']
        emailVerified:
          type: boolean
        locale:
          type: [string, 'null']
        timezone:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
    ErrorEnvelope:
      type: object
      description: |
        Hình dạng lỗi ổn định cho MỌI lỗi rời khỏi API, kể cả lỗi không lường trước.

        Ràng buộc bảo mật: không bao giờ chứa stack trace, secret, connection string
        hay chi tiết nội bộ. Với lỗi 5xx, `message` luôn là thông điệp chung — chi tiết
        thật chỉ đi vào log phía server, truy được bằng `correlationId`.
      required: [code, message, correlationId]
      additionalProperties: false
      properties:
        code:
          type: string
          description: |
            Mã máy đọc được, ổn định, không phụ thuộc câu chữ giao diện.
            Client bắt lỗi theo trường này.
          pattern: '^[A-Z][A-Z0-9_]*$'
          examples:
            - INTERNAL_ERROR
            - VALIDATION_FAILED
            - SERVICE_UNAVAILABLE
        message:
          type: string
          description: Thông điệp an toàn để hiển thị.
          maxLength: 500
        correlationId:
          type: string
          format: uuid
          description: |
            Truy vết xuyên BFF -> API -> worker -> log.
            Nhận từ header `X-Correlation-Id` nếu hợp lệ, ngược lại server sinh mới (UUIDv7).
            **Không phải** idempotency key — đừng dùng lẫn.
        details:
          type: object
          description: Chi tiết bổ sung theo allowlist. Không bao giờ chứa dữ liệu nhạy cảm.
          additionalProperties: true

  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: |
        UUID để truy vết. Không gửi thì server tự sinh.
        Định dạng sai KHÔNG làm request fail — server bỏ qua và sinh cái mới, vì làm hỏng
        một request hợp lệ chỉ vì header truy vết xấu là đánh đổi sai.
      schema:
        type: string
        format: uuid

security: []
