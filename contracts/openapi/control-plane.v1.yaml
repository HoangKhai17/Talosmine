openapi: 3.1.0

# NGUỒN SỰ THẬT của Control Plane API (DEC-T07).
#
# Đây là file VIẾT TAY. Nó không được sinh ra từ code.
# Thứ tự bắt buộc: sửa file này -> `pnpm openapi:lint` -> `pnpm openapi:types` ->
# commit type đã sinh -> rồi mới implement.
#
# Vì sao spec-first chứ không code-first (@nestjs/swagger):
# build plan yêu cầu CONTRACT FREEZE TRƯỚC khi ba lane frontend/backend/tester chạy
# song song. Code-first sẽ đảo ngược thứ tự đó — spec chỉ tồn tại sau khi code xong,
# nên không có gì để freeze, và frontend buộc phải đoán API.
#
# `pnpm openapi:drift` chặn việc spec và type đã commit lệch nhau.
#
# PHẠM VI P1: chỉ health. Mọi endpoint nghiệp vụ (identity, catalog, plan, quota)
# thuộc P2+ và CHƯA tồn tại — không khai ở đây để tránh mô tả thứ không có.

info:
  title: Talosmine Control Plane API
  version: 1.0.0
  description: |
    Control Plane của Talosmine — nguồn sự thật về identity, entitlement và quota.

    **Trạng thái: P1 (bootstrap).** Chỉ có health endpoint. Không có capability nghiệp vụ nào.

    Quy ước xuyên phase:
    - Số lượng (quantity/limit/counter/amount) biểu diễn bằng **decimal string**, không phải
      JSON number — PostgreSQL dùng `bigint` và JSON number mất chính xác ngoài 2^53.
    - Thời gian dùng timestamp có timezone; business time dựa DB clock.
    - Mọi lỗi trả về `ErrorEnvelope` với `code` máy đọc được. Client bắt theo `code`,
      không theo `message`.
  license:
    name: UNLICENSED

servers:
  - url: https://talosmine.localhost
    description: Local dev qua Caddy (DEC-T11)

tags:
  - name: health
    description: |
      Endpoint hạ tầng cho orchestrator và reverse proxy.
      Nằm NGOÀI versioning `/v1` vì nó không phải API nghiệp vụ có contract với client.
  - name: auth
    description: |
      Cầu nối giữa OIDC và phiên nội bộ. BFF chạy luồng Authorization Code với IdP rồi đổi
      `id_token` lấy session token của Talosmine tại đây.

      Control Plane TỰ xác minh chữ ký token bằng JWKS — không tin claim do caller khai.
      Phiên là của Talosmine, không phải của IdP: nhờ vậy nó thu hồi được, liệt kê được và
      có audit. Xem `docs/identity-provider.md`.
  - name: account
    description: |
      API tài khoản của chính user (self-service). Bảo vệ bằng web session:
      BFF forward session token qua header `X-Session-Token`; Control Plane resolve
      accountId phía server, KHÔNG tin accountId do client khai.
  - name: catalog
    description: |
      Danh muc ung dung cho nguoi dung cuoi. Chi tra app `active`.

      Thay app KHONG co nghia la duoc dung app — catalog visibility khac authorization.
      Quyen su dung thuoc entitlement (P4), va ung dung dich van phai tu xac thuc.
  - name: admin
    description: |
      API quản trị. DENY-BY-DEFAULT: cần phiên hợp lệ **và** permission tương ứng qua
      RBAC (role còn `active`, assignment còn hiệu lực và chưa thu hồi). Mọi mutation
      bắt buộc có `reason` và ghi audit đồng bộ trong cùng transaction.
  - name: survey
    description: |
      Khảo sát onboarding hiển thị sau khi đăng ký. Người dùng hoàn tất hoặc bỏ qua; cả hai
      đều được ghi lại, vì thiếu bản ghi "đã bỏ qua" thì hệ thống sẽ hỏi lại mãi.

      Cấu trúc câu hỏi CỐ ĐỊNH (seed bằng migration, code biết trước để render đúng layout);
      nội dung và danh sách lựa chọn sửa được trong `/admin`.

      **Câu trả lời là dữ liệu cá nhân.** Quyền đọc chúng (`survey_response:read`) tách khỏi
      quyền sửa câu hỏi (`content:*`) — biên tập nội dung khác với truy cập dữ liệu người dùng.
      Thời hạn lưu thuộc DEC-B11, chưa chốt.
  - name: site-content
    description: |
      Nội dung điều hướng (header/footer) do quản trị viên sửa, thay cho chữ hardcode
      trong code. Đường ĐỌC ở đây là bề mặt CÔNG KHAI duy nhất không cần phiên đăng nhập:
      header và footer phải render được cho cả khách vãng lai.

      Ranh giới: code quyết định CHỖ NÀO có gì (bố cục, số cột, thứ tự section); CMS quyết
      định CHỮ GÌ nằm ở đó. Không nhận HTML — xem DEC-T25.

paths:
  /health/live:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Liveness probe
      description: |
        Process và event loop còn đáp ứng hay không. **KHÔNG chạm database.**

        Vì sao không chạm DB: liveness quyết định việc RESTART container. Nếu nó phụ thuộc
        DB thì một sự cố DB sẽ làm restart hàng loạt app vốn đang khoẻ — biến sự cố một
        thành phần thành sự cố toàn hệ thống. Dùng `/health/ready` cho việc kiểm dependency.
      security: []
      responses:
        '200':
          description: Process còn sống.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status:
                    type: string
                    const: ok
              example:
                status: ok

  /health/ready:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness probe
      description: |
        Có nên nhận traffic không. **CÓ** kiểm tra dependency bắt buộc (database).

        DB chết -> trả 503 -> ngừng nhận traffic, nhưng container KHÔNG bị restart.

        Response cố ý tối giản: không lộ host DB, version, connection string hay chi tiết
        dependency nào. Health endpoint không được trở thành công cụ do thám topology.
      security: []
      responses:
        '200':
          description: Sẵn sàng nhận traffic.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status:
                    type: string
                    const: ready
              example:
                status: ready
        '503':
          description: Dependency chưa sẵn sàng. Không nhận traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: SERVICE_UNAVAILABLE
                message: Dependency chưa sẵn sàng.
                correlationId: 018f3a2b-7c4d-7000-8000-000000000000

  /v1/auth/sessions:
    post:
      tags: [auth]
      operationId: exchangeIdTokenForSession
      summary: Đổi ID token của IdP lấy phiên Talosmine
      description: |
        Cầu nối giữa OIDC và phiên nội bộ. BFF chạy luồng Authorization Code với IdP rồi
        gửi NGUYÊN `id_token` tới đây.

        Control Plane **tự xác minh chữ ký** bằng JWKS của issuer — nó không nhận
        `issuer`/`subject`/`accountId` do caller khai. Nếu tin claim của caller thì bất kỳ
        ai gọi được endpoint này đều mạo danh được người khác.

        Sau khi xác minh: tìm hoặc tạo account theo `(issuer, subject)`, kiểm trạng thái
        account, rồi phát session token. Endpoint này KHÔNG cần phiên có sẵn.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              additionalProperties: false
              properties:
                idToken:
                  type: string
                  description: ID token JWT do IdP phát.
      responses:
        '201':
          description: Đã tạo phiên.
          content:
            application/json:
              schema:
                type: object
                required: [sessionToken, csrfToken, expiresAt, accountId, created]
                properties:
                  sessionToken:
                    type: string
                    description: Token thô. Chỉ trả về MỘT LẦN; DB chỉ lưu hash.
                  csrfToken:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
                  accountId:
                    type: string
                    format: uuid
                  created:
                    type: boolean
                    description: true nếu account vừa được tạo lần đầu.
        '400':
          description: Thiếu `idToken`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token không hợp lệ — sai chữ ký, hết hạn, sai issuer hoặc sai audience.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: |
            Account không ở trạng thái `active`. Thông điệp cố ý chung chung, không phân
            biệt `pending` với `disabled`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/auth/sessions/current:
    delete:
      tags: [auth]
      operationId: logout
      summary: Đăng xuất — thu hồi phiên hiện tại
      description: |
        Thu hồi đúng phiên đang dùng để gọi request này. `sessionId` lấy từ session token
        phía server, không phải từ body — không ai đăng xuất hộ người khác được.

        Khác `DELETE /v1/me/account/sessions/all` (đăng xuất mọi thiết bị): đây chỉ là
        thiết bị hiện tại.
      security:
        - webSession: []
      responses:
        '204':
          description: Đã thu hồi (idempotent — gọi lại không lỗi).
        '401':
          description: Thiếu phiên hoặc phiên không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Thiếu hoặc sai CSRF token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/me/permissions:
    get:
      tags: [account]
      operationId: getOwnPermissions
      summary: Permission quản trị của chính mình
      description: |
        Danh sách rỗng nghĩa là không phải admin. Frontend dùng để quyết định có hiện khu
        vực `/admin` hay không.

        Đây thuần túy là UX — mọi endpoint admin vẫn tự kiểm quyền phía server, nên
        endpoint này có nói dối cũng không cấp thêm quyền nào.
      security:
        - webSession: []
      responses:
        '200':
          description: Danh sách permission còn hiệu lực.
          content:
            application/json:
              schema:
                type: object
                required: [permissions]
                properties:
                  permissions:
                    type: array
                    items:
                      type: string
        '401':
          description: Thiếu phiên hoặc phiên không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/me/onboarding:
    get:
      tags: [survey]
      operationId: getOwnOnboarding
      summary: Khảo sát onboarding — cần trả lời hay chưa, và nội dung câu hỏi
      description: |
        Cần phiên đăng nhập: khảo sát gắn với một account cụ thể.

        `required = false` khi account này đã hoàn tất HOẶC đã bỏ qua. BFF gọi endpoint này
        ngay sau khi đổi được phiên ở `/auth/callback` để quyết định có chuyển hướng sang
        màn hình khảo sát hay không.

        Chỉ trả câu hỏi `active` và lựa chọn `active`, kèm nhãn theo `locale` yêu cầu. Lựa
        chọn thiếu bản dịch cho ngôn ngữ đó bị BỎ QUA — cùng quy tắc với điều hướng site.
      security:
        - webSession: []
      parameters:
        - name: locale
          in: query
          required: true
          schema:
            type: string
            enum: [vi, en]
      responses:
        '200':
          description: Trạng thái onboarding và bộ câu hỏi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingSurvey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [survey]
      operationId: submitOwnOnboarding
      summary: Nộp hoặc bỏ qua khảo sát
      description: |
        Cần phiên đăng nhập. Một account nộp ĐÚNG MỘT LẦN — gọi lần hai trả 409.

        `status = 'skipped'` cũng tạo bản ghi và KHÔNG kèm câu trả lời. Ghi lại việc bỏ qua
        là có chủ đích: thiếu nó thì hệ thống không phân biệt được "chưa từng hỏi" với "đã
        hỏi và họ từ chối", nên sẽ hỏi lại mãi.

        SERVER KIỂM LẠI TOÀN BỘ, không tin client — màn hình có thể bị bỏ qua bằng cách gọi
        thẳng endpoint này:
          - mọi `optionKey` phải thuộc đúng `questionKey` và đang `active`;
          - câu `single` chỉ nhận một lựa chọn;
          - câu `multi` phải đủ `minSelect`.
      security:
        - webSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitOnboardingRequest'
      responses:
        '204':
          description: Đã ghi nhận.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Account này đã trả lời khảo sát rồi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/me/onboarding/response:
    get:
      tags: [survey]
      operationId: getOwnSurveyResponse
      summary: Câu trả lời khảo sát của chính mình — đọc được
      description: |
        Cần phiên đăng nhập. Khác `SurveyResponseRecord` (dành cho admin, chỉ trả khoá thô
        để tổng hợp): endpoint này trả nội dung ĐỌC ĐƯỢC — câu hỏi và lựa chọn đã dịch theo
        `locale` yêu cầu, cho chính account đang gọi.

        404 khi account này chưa từng trả lời/bỏ qua khảo sát.

        Câu hỏi/lựa chọn đã bị admin đổi trạng thái SAU KHI trả lời vẫn hiển thị đầy đủ — đây
        là LỊCH SỬ câu trả lời của người dùng, không phải bộ câu hỏi hiện đang hỏi (khác
        `GET /v1/me/onboarding`, chỉ trả mục `active`).
      security:
        - webSession: []
      parameters:
        - name: locale
          in: query
          required: true
          schema:
            type: string
            enum: [vi, en]
      responses:
        '200':
          description: Câu trả lời (hoặc bỏ qua) của chính account đang đăng nhập.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnSurveyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [survey]
      operationId: deleteOwnSurveyResponse
      summary: Xoá câu trả lời khảo sát của chính mình
      description: |
        Cần phiên đăng nhập. Xoá HẲN bản ghi `survey_responses` của account này — câu trả lời
        liên quan (`survey_answers`) bị xoá theo tầng ở database, không cần gọi riêng.

        Sau khi xoá, account trở lại trạng thái "chưa onboard" (`GET /v1/me/onboarding` sẽ
        trả `required: true` ở lần đăng nhập kế tiếp).

        Không phải thu hồi/vô hiệu hoá — đây là XOÁ DỮ LIỆU CÁ NHÂN theo yêu cầu chính chủ
        (DEC-B11). Không có audit log cho thao tác này, cùng lý do đã ghi ở
        `POST /v1/me/onboarding`: dữ liệu của chính người dùng, không phải một thao tác quản
        trị cần biện minh.
      security:
        - webSession: []
      responses:
        '204':
          description: Đã xoá.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/me/account:
    patch:
      tags: [account]
      operationId: updateOwnAccount
      summary: Sửa hồ sơ của chính mình
      description: |
        ALLOWLIST ba trường: `displayName`, `locale`, `timezone`. Trường ngoài danh sách bị
        BỎ QUA im lặng — client cũ gửi thừa vẫn chạy, mà field đó vẫn vô tác dụng.

        `status` chỉ admin đổi qua endpoint riêng có audit. `email` và `emailVerified` do
        IdP sở hữu — tự khai ở đây là tự phong "đã xác minh".

        Chuỗi rỗng nghĩa là XÓA giá trị (lưu NULL), không lưu chuỗi rỗng.
      security:
        - webSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: [string, 'null']
                  maxLength: 100
                locale:
                  type: [string, 'null']
                  maxLength: 35
                timezone:
                  type: [string, 'null']
                  maxLength: 64
      responses:
        '200':
          description: Hồ sơ sau khi cập nhật.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnAccount'
        '400':
          description: Giá trị sai kiểu hoặc vượt độ dài cho phép.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Thiếu phiên hoặc phiên không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Thiếu hoặc sai CSRF token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      tags: [account]
      operationId: getOwnAccount
      summary: Xem tài khoản của chính mình
      description: |
        Trả hồ sơ của account gắn với phiên hiện tại. accountId được Control Plane resolve
        từ session token phía server — không có tham số path/query/body nào cho phép hỏi
        account của người khác.
      security:
        - webSession: []
      responses:
        '200':
          description: Hồ sơ account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnAccount'
        '401':
          description: Thiếu phiên, phiên sai, hết hạn hoặc đã thu hồi (fail-closed, không phân biệt lý do).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/me/account/sessions:
    get:
      tags: [account]
      operationId: listOwnSessions
      summary: Liệt kê phiên đăng nhập của chính mình
      description: |
        Trả các phiên của account hiện tại (trang "thiết bị đang đăng nhập").
        KHÔNG trả hash token — chỉ metadata đủ để user nhận ra phiên nào là phiên nào.
      security:
        - webSession: []
      responses:
        '200':
          description: Danh sách phiên.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionSummary'
        '401':
          description: Không có phiên hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/me/account/sessions/all:
    delete:
      tags: [account]
      operationId: revokeAllOwnSessions
      summary: Đăng xuất mọi nơi
      description: |
        Thu hồi TẤT CẢ phiên còn hiệu lực của account, kể cả phiên đang gọi request này.
        Idempotent: gọi lại khi không còn phiên nào vẫn trả 204.
      security:
        - webSession: []
      responses:
        '204':
          description: Đã thu hồi (không có nội dung trả về).
        '401':
          description: Không có phiên hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/me/account/sessions/{sessionId}:
    delete:
      tags: [account]
      operationId: revokeOwnSession
      summary: Thu hồi một phiên của chính mình
      description: |
        Chỉ thu hồi được phiên THUỘC account hiện tại. Phiên của người khác, phiên không
        tồn tại, và phiên đã thu hồi đều trả 404 giống nhau — không tiết lộ sessionId nào
        là có thật (chống dò).
      security:
        - webSession: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Đã thu hồi.
        '400':
          description: sessionId không phải UUID hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Không có phiên hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Không tìm thấy phiên thuộc account này.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/catalog/applications:
    get:
      tags: [catalog]
      operationId: listPublicApplications
      summary: Danh muc ung dung cho nguoi dung
      description: |
        CHI tra app `active`. App `draft` va `inactive` khong xuat hien, ke ca khi nguoi
        dung doan dung `key`.

        QUAN TRONG: **thay app KHONG co nghia la duoc dung app.** Endpoint nay tra loi
        "app nao ton tai va dang phat hanh", KHONG tra loi "nguoi nay co quyen mo no".
        Cau do thuoc entitlement (P4). Ung dung dich van phai tu xac thuc va phan quyen.

        Yeu cau phien dang nhap: danh muc app noi bo khong phai thong tin cong khai.
      security:
        - webSession: []
      responses:
        '200':
          description: Danh sach app dang phat hanh, sap theo ten hien thi.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicApplication'
        '401':
          description: Thieu phien hoac phien khong hop le.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/catalog/applications/{key}:
    get:
      tags: [catalog]
      operationId: getPublicApplication
      summary: Chi tiet mot ung dung
      description: |
        Tra theo `key` chu khong phai `id`: `key` la dinh danh on dinh ma con nguoi doc
        duoc va URL dung duoc. `id` la chi tiet noi bo.

        App chua phat hanh tra 404 GIONG HET app khong ton tai. Phan biet hai truong hop
        cho phep do xem he thong dang chuan bi nhung app nao.
      security:
        - webSession: []
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Chi tiet app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApplication'
        '401':
          description: Thieu phien hoac phien khong hop le.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Khong tim thay, HOAC ton tai nhung chua phat hanh.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/admin/catalog/applications:
    get:
      tags: [admin]
      operationId: adminListApplications
      summary: Danh muc ung dung (quan tri)
      description: Yeu cau `catalog:read`. Tra MOI trang thai, ke ca `draft`.
      security:
        - webSession: []
      responses:
        '200':
          description: Danh sach app, sap theo `key`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminApplication'
        '403':
          description: Thieu permission `catalog:read`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags: [admin]
      operationId: adminCreateApplication
      summary: Tao ung dung moi
      description: |
        Yeu cau `catalog:manage`. App moi LUON o trang thai `draft` — khong tao thang
        `active`. Phat hanh la hanh dong rieng can `catalog:publish`.

        `launchUrl` va `imageUrl` di qua CHINH SACH URL truoc khi cham database: bat buoc
        https, host phai trong allowlist, chan dia chi noi bo. Xem `docs/url-policy.md`.

        URL duoc luu o DANG CHUAN HOA, khong phai chuoi goc.
      security:
        - webSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, displayName, launchUrl, reason]
              properties:
                key:
                  type: string
                  maxLength: 64
                  pattern: '^[a-z][a-z0-9-]*$'
                  description: |
                    Machine key ON DINH va BAT BIEN. Policy request, plan grant va du lieu
                    usage tham chieu no. Khong co duong sua sau khi tao, ke ca cho quan tri.
                displayName: { type: string, maxLength: 120 }
                description: { type: [string, 'null'], maxLength: 2000 }
                imageUrl: { type: [string, 'null'], maxLength: 2048 }
                launchUrl: { type: string, maxLength: 2048 }
                reason:
                  type: string
                  minLength: 1
                  description: Bat buoc — ghi vao nhat ky kiem toan.
      responses:
        '201':
          description: Da tao, o trang thai `draft`.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        '400':
          description: |
            Thieu `reason`, `key` sai dinh dang, hoac URL khong dat chinh sach (khong phai
            https / host chua allowlist / co userinfo).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Thieu permission `catalog:manage`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: '`key` da duoc dung. Key KHONG tai su dung duoc.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/admin/catalog/applications/{applicationId}:
    get:
      tags: [admin]
      operationId: adminGetApplication
      summary: Chi tiet ung dung (quan tri)
      description: Yeu cau `catalog:read`.
      security:
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Chi tiet app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminApplication'
        '403':
          description: Thieu permission `catalog:read`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Khong tim thay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      tags: [admin]
      operationId: adminUpdateApplication
      summary: Sua metadata ung dung
      description: |
        Yeu cau `catalog:manage`.

        KHONG sua duoc `key` (bat bien) va KHONG sua duoc `status` (co duong rieng, can
        permission khac). Truong la trong body bi BO QUA im lang.

        URL moi van di qua chinh sach URL.
      security:
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                displayName: { type: string, maxLength: 120 }
                description: { type: [string, 'null'], maxLength: 2000 }
                imageUrl: { type: [string, 'null'], maxLength: 2048 }
                launchUrl: { type: string, maxLength: 2048 }
                reason: { type: string, minLength: 1 }
      responses:
        '204':
          description: Da cap nhat.
        '400':
          description: Thieu `reason` hoac URL khong dat chinh sach.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Thieu permission `catalog:manage`, hoac thieu/sai CSRF token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Khong tim thay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/admin/catalog/applications/{applicationId}/status:
    post:
      tags: [admin]
      operationId: adminChangeApplicationStatus
      summary: Doi trang thai vong doi
      description: |
        Yeu cau `catalog:publish` — permission RIENG, khong phai `catalog:manage`.

        Vi sao tach: dua app sang `active` la mo mot `launch_url` cho nguoi dung bam vao.
        Do la hanh dong co he qua ben ngoai, khac han viec sua mo ta o trang thai nhap.
        Nguoi soan noi dung va nguoi quyet dinh phat hanh khong nhat thiet la mot.

        Chuyen tiep hop le:
            draft  -> active
            active -> inactive
            inactive -> active

        KHONG quay lai `draft`: app da tung `active` nghia la nguoi dung da thay no va co
        the da co du lieu usage. Dua ve `draft` tao ra trang thai "chua tung phat hanh"
        cho mot thu da phat hanh — dau vet lich su noi doi. Muon go thi dung `inactive`.
      security:
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reason]
              properties:
                status: { type: string, enum: [active, inactive] }
                reason: { type: string, minLength: 1 }
      responses:
        '204':
          description: Da doi trang thai.
        '400':
          description: Chuyen tiep khong hop le, hoac thieu `reason`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Thieu permission `catalog:publish`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Khong tim thay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/admin/catalog/applications/{applicationId}/redirect-uris:
    get:
      tags: [admin]
      operationId: adminListRedirectUris
      summary: Allowlist redirect URI cua mot ung dung
      description: Yeu cau `catalog:read`.
      security:
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Danh sach URI.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RedirectUri'
        '403':
          description: Thieu permission `catalog:read`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags: [admin]
      operationId: adminAddRedirectUri
      summary: Them mot redirect URI vao allowlist
      description: |
        Yeu cau `catalog:manage`.

        DAY LA BE MAT NHAY CAM NHAT CUA CATALOG. Redirect URI quyet dinh noi authorization
        code duoc gui toi sau khi nguoi dung dang nhap. Mot entry sai nghia la code — va
        qua do la phien cua nguoi dung — roi vao tay nguoi khac.

        So khop CHINH XAC tung ky tu: khong wildcard, khong prefix, khong subdomain.
        URI di qua cung chinh sach URL nhu `launchUrl` va duoc luu o DANG CHUAN HOA —
        neu khong, phep so khop cua IdP se truot khi chuoi khac nhau nhung tro cung noi.
      security:
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, uri, reason]
              properties:
                purpose: { type: string, enum: [login, logout] }
                uri: { type: string, maxLength: 2048 }
                reason: { type: string, minLength: 1 }
      responses:
        '201':
          description: Da them.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        '400':
          description: URI khong dat chinh sach, `purpose` sai, hoac thieu `reason`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Thieu permission `catalog:manage`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Khong tim thay ung dung.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: URI da co trong allowlist voi cung `purpose`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/admin/catalog/applications/{applicationId}/redirect-uris/{redirectUriId}:
    delete:
      tags: [admin]
      operationId: adminRemoveRedirectUri
      summary: Go mot redirect URI khoi allowlist
      description: |
        Yeu cau `catalog:manage`.

        Day la cho DUY NHAT trong catalog thuc su XOA dong — moi noi khac doi `status`.
        Ly do: allowlist la tap gia tri duoc phep O THOI DIEM HIEN TAI, khong phai lich su.
        Giu mot URI "da go" trong bang se doi moi truy van so khop phai nho loc no ra, va
        quen mot lan la lo hong.

        Dau vet lich su nam o `audit_events` — gia tri da xoa duoc ghi vao `details`.

        Request mang BODY du la `DELETE`: `reason` bat buoc cho nhat ky kiem toan.
      security:
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - name: redirectUriId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        '204':
          description: Da go.
        '400':
          description: Thieu `reason`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Thieu permission `catalog:manage`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: |
            Khong tim thay URI TRONG ung dung nay. Tra 404 ca khi URI ton tai nhung thuoc
            ung dung khac — moi route rang buoc theo `applicationId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/admin/catalog/applications/{applicationId}/features:
    get:
      tags: [admin]
      operationId: adminListFeatures
      summary: Feature cua mot ung dung
      description: Yeu cau `catalog:read`.
      security:
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Danh sach feature, sap theo `key`.
          content:
            application/json:
