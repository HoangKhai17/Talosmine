  /v1/admin/catalog/applications/{applicationId}/features/{featureId}/status:
    post:
      tags: [admin]
      operationId: adminChangeFeatureStatus
      summary: Doi trang thai feature
      description: |
        Yeu cau `catalog:publish` — cung ly do voi application: bat mot feature nghia la
        plan co the cap quyen len no va nguoi dung co the dung no.

        Dung CHUNG may trang thai voi application: `draft` -> `active` <-> `inactive`,
        khong quay lai `draft`.
      security:
        - webSession: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/FeatureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reason]
              properties:
                status: { type: string, enum: [active, inactive] }
                reason: { type: string, minLength: 1 }
      responses:
        '204':
          description: Da doi trang thai.
        '400':
          description: Chuyen tiep khong hop le hoac thieu `reason`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Thieu permission `catalog:publish`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Khong tim thay feature TRONG ung dung nay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/admin/audit:
    get:
      tags: [admin]
      operationId: adminListAuditEvents
      summary: Tra cuu nhat ky kiem toan
      description: |
        Yeu cau permission `audit:read`.

        CHI DOC, va khong the khac: bang `audit_events` bi trigger o tang database chan moi
        `UPDATE`/`DELETE`, con runtime role khong duoc cap `TRUNCATE`. Ba lop do doc lap
        nhau, nen API khong co duong sua vi ha tang ben duoi cung khong cho phep.

        Khong tra cot `details` - truong do co the chua du lieu chua loc.
      security:
        - webSession: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: targetId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Danh sach su kien, moi nhat truoc.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'
                  nextCursor:
                    type: [string, 'null']
                    format: date-time
        '401':
          description: Thieu phien hoac phien khong hop le.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Thieu permission `audit:read`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

